openapi: 3.1.0
info:
  title: Kalamar community protocol
  version: "1.1"
  summary: 'HTTPS API between a launcher and a community service, protocol 1.1, revision 1.1.13 (additive over 1.0).'
  description: >-
    Machine-readable form of api.md and of the 1.1 documents (activities.md, series.md, match-contract-2.md,
    presentation.md, operators.md, extending.md, draft.md, spectators.md, leaving.md, relay.md); when they differ, those documents win and the difference is a bug.
    Every 1.1 addition is optional, gated by `features` (or by `operator_api` for the operator paths), and ignorable
    by 1.0 launchers. The operator paths use the separate `botBearer` scheme and are never called by launchers. Game
    identifiers (modes, stages, weapons, gear) are opaque and appear only as placeholders such as `<mode id>`. Any object MAY
    carry unknown members and `x-` extension members, which receivers ignore, so no schema here forbids additional
    properties. Enumerations are open: known values are listed in `examples` or in the description, and an unknown
    value stays valid. Every member shown in an api.md example is required (possibly `null`) unless api.md calls it
    optional or conditional; the public view of a match is the exception. Errors that apply to many endpoints are
    listed per operation from api.md Conventions, api.md Moderation (Bans) and overview.md section 6: 401 and 403
    `banned` on authenticated endpoints, 404 `not_found` on endpoints with a path parameter, 404 `feature_disabled`
    on optional areas, 400 `invalid_json`, 408 `bad_request`, 413 and 422 on request bodies, 429 everywhere; any
    other code of api.md Error codes (`internal`, `unavailable`, ...) falls under `default`. Requests carry
    `Kalamar-Protocol` and optionally `Accept-Language`; responses carry `Kalamar-Protocol`, `Retry-After` with 429,
    and `Cache-Control: no-store` when they hold tokens or private data.
  license:
    name: MIT
servers:
  - url: '{api}'
    description: 'The `api` base URL of the discovery document or server card (server-card.md).'
    variables:
      api:
        default: 'https://play.example.org/api'
tags:
  - name: discovery
    description: 'Core: the discovery document (server-card.md).'
  - name: meta
    description: 'Core: api.md Meta.'
  - name: auth
    description: 'Core: api.md Authentication.'
  - name: account
    description: 'Core: api.md Account.'
  - name: events
    description: 'Core: the event stream (events.md).'
  - name: matches
    description: 'Core: api.md Matches.'
  - name: queues
    description: 'Area `queues`: api.md Queues and the accept phase of api.md Matches.'
  - name: rooms
    description: 'Area `rooms`: api.md Private rooms.'
  - name: parties
    description: 'Area `parties`: api.md Parties.'
  - name: friends
    description: 'Area `friends` (presence needs `presence` too): api.md Friends and presence.'
  - name: ratings
    description: 'Area `ratings`: api.md Ratings.'
  - name: leaderboards
    description: 'Area `leaderboards`: api.md Ratings, Leaderboard.'
  - name: stats
    description: 'Area `stats`: api.md Statistics and history.'
  - name: moderation
    description: 'Area `moderation`: api.md Moderation.'
  - name: test-clock
    description: 'Only on test servers declaring `test-clock`: api.md Test clock.'
  - name: activities
    description: '1.1, area `activities`: server-designed activities rendered as views (activities.md).'
  - name: series
    description: '1.1, area `series`: chains of matches between the same sides (series.md).'
  - name: badges
    description: '1.1, area `badges`: badges and titles (presentation.md section 1).'
  - name: profiles
    description: '1.1, area `profiles`: server-designed profile pages (presentation.md section 2).'
  - name: operator
    description: '1.1, declared in `operator_api`: bot and administration API for the operator tools, never called by launchers (operators.md).'
  - name: population
    description: '1.1.4, area `population`: public counts of players online, in a match and searching (api.md Population).'
  - name: draft
    description: '1.1.6, area `draft`: the stage (and mode) draft between "match found" and the launch (draft.md).'
  - name: spectators
    description: '1.1.7, area `spectators`: places in the stands of a match; spectators are never players, their reports are witness reports (spectators.md).'

paths:

  # ---------------------------------------------------------------- discovery and meta

  /.well-known/kalamar-server.json:
    servers:
      - url: 'https://{host}'
        description: 'The discovery host of the one-line form (server-card.md section 1), not the API base.'
        variables:
          host:
            default: play.example.org
            description: 'host[:port] typed by the player; the port is the HTTPS port (default 443).'
    get:
      tags: [discovery]
      operationId: getDiscoveryDocument
      summary: 'Discovery document of a server.'
      description: 'Public entry point of the one-line form, at most 64 KiB (server-card.md section 2).'
      security: []
      responses:
        '200':
          description: 'The discovery document; SHOULD carry `Cache-Control: max-age=300` or longer.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiscoveryDocument'}

  /v1/meta:
    parameters:
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [meta]
      operationId: getMeta
      summary: 'Everything the service offers.'
      description: 'Fetched when the server is added, at each start and on `meta.changed` (api.md Meta).'
      security: []
      responses:
        '200':
          description: 'The meta document.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Meta'}
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  # ---------------------------------------------------------------- authentication

  /v1/auth/{provider}/login:
    parameters:
      - $ref: '#/components/parameters/Provider'
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      tags: [auth]
      operationId: loginDirect
      summary: 'Log in with a direct provider.'
      description: 'The body carries the `fields` of the provider; a banned account can log in (api.md Authentication, Direct providers).'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginFields'}
      responses:
        '200':
          description: 'A session.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400':
          $ref: '#/components/responses/InvalidJson'
        '403':
          $ref: '#/components/responses/Error'
          description: '1.1.5, password forms: `wrong_password` (the same answer whether or not the address has an account).'
        '404':
          $ref: '#/components/responses/Error'
          description: '`not_found`: unknown or non-direct provider.'
        '409':
          $ref: '#/components/responses/Error'
          description: '1.1.5, password sign-up without address confirmation: `account_exists`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Error'
          description: '`validation_failed` (`field` names the member); 1.1.5 `code_required` (a one-time code was sent or must be asked for; send the form again with `code`).'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/auth/{provider}/begin:
    parameters:
      - $ref: '#/components/parameters/Provider'
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      tags: [auth]
      operationId: beginOAuthLogin
      summary: 'Start an OAuth loopback login.'
      description: 'Step 2 of the PKCE loopback flow (api.md Authentication, OAuth loopback providers).'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OAuthBegin'}
      responses:
        '200':
          description: 'The authorization URL to open in the system browser.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthBeginAnswer'}
        '400':
          $ref: '#/components/responses/InvalidJson'
        '404':
          $ref: '#/components/responses/Error'
          description: '`not_found`: unknown or non-OAuth provider.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Error'
          description: '`validation_failed`, for example a `redirect_uri` that is not one of `loopback_redirects`.'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/auth/{provider}/complete:
    parameters:
      - $ref: '#/components/parameters/Provider'
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      tags: [auth]
      operationId: completeOAuthLogin
      summary: 'Finish an OAuth loopback login.'
      description: 'Step 4 of the PKCE loopback flow (api.md Authentication, OAuth loopback providers).'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OAuthComplete'}
      responses:
        '200':
          description: 'A session.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400':
          $ref: '#/components/responses/Error'
          description: '`invalid_state` (unknown, expired or used state), `pkce_mismatch` or `invalid_json`.'
        '404':
          $ref: '#/components/responses/Error'
          description: '`not_found`: unknown or non-OAuth provider.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/Error'
          description: '`provider_error`: the login provider refused or failed.'
        default:
          $ref: '#/components/responses/Default'

  /v1/auth/refresh:
    parameters:
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      tags: [auth]
      operationId: refreshSession
      summary: 'Exchange a refresh token for a new token pair.'
      description: 'Rotates both tokens, also for a banned account; a reuse after 60 s revokes the session (api.md Authentication, Tokens).'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200':
          description: 'A session, with `me`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Error'
          description: '`unauthorized` or `session_revoked`: log in again.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/auth/logout:
    parameters:
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      tags: [auth]
      operationId: logout
      summary: 'Revoke this session, or every session of the account.'
      description: 'Event connections of the revoked sessions are closed; works for banned accounts (api.md Authentication).'
      security:
        - bearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LogoutRequest'}
      responses:
        '204':
          description: 'Revoked.'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  # ---------------------------------------------------------------- account

  /v1/me:
    parameters:
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [account]
      operationId: getMe
      summary: 'The account of the caller.'
      description: 'Works for banned accounts (api.md Account, Me object).'
      security:
        - bearer: []
      responses:
        '200':
          description: 'The Me object.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'
    patch:
      tags: [account]
      operationId: updateMe
      summary: 'Change the display name, settings, or (1.1) the featured badge and title.'
      description: 'Every member of the body is optional (api.md Account, PATCH /v1/me; presentation.md section 1).'
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MeUpdate'}
      responses:
        '200':
          description: 'The updated Me object.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Banned'
        '409':
          $ref: '#/components/responses/Error'
          description: '`name_change_too_soon` (with `retry_after_s`) or `display_name_taken`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Error'
          description: '`validation_failed`, for example `field` `/display_name` outside `limits.display_name`.'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'
    delete:
      tags: [account]
      operationId: eraseMe
      summary: 'Erase the account.'
      description: 'Ends every session, deletes the data and anonymizes past matches; works for banned accounts (api.md Account).'
      security:
        - bearer: []
      parameters:
        - name: confirm
          in: query
          required: true
          description: 'Must be `erase`; without it the server answers 422 `validation_failed`.'
          schema:
            type: string
            const: erase
      responses:
        '204':
          description: 'Erased.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Error'
          description: '`validation_failed`: `confirm=erase` is missing.'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/me/export:
    parameters:
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [account]
      operationId: exportMe
      summary: 'Everything the server holds about the player.'
      description: 'One JSON document in the format of the server; works for banned accounts (api.md Account).'
      security:
        - bearer: []
      responses:
        '200':
          description: 'The export document.'
          headers:
            Content-Disposition:
              description: '`attachment`.'
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                description: 'Server-defined; MUST include the data listed in api.md Account, GET /v1/me/export.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/me/password:
    parameters:
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      tags: [account]
      operationId: changeMyPassword
      summary: 'Change the password of a password account (1.1.5, optional).'
      description: 'The current password is checked; every other session of the account ends, this one stays. Offered when Me has `password` (api.md Account, POST /v1/me/password).'
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, new_password]
              properties:
                password: {type: string, description: 'The current password.'}
                new_password: {type: string, description: 'Within the `min_len`/`max_len` of the server''s password forms.'}
      responses:
        '204':
          description: 'Changed.'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
          description: '`wrong_password` (the current password) or `banned`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: the account has no password, or the server no password accounts.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/me/game:
    parameters:
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    put:
      tags: [account]
      operationId: putGameCapabilities
      summary: 'Declare what the game build of the player supports.'
      description: 'Sent after each login and whenever the game build or engine changes; 1.1 adds `contracts`, `engine` and `options`; a server MAY ignore it (api.md Account, match-contract-2.md section 2).'
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GameCapabilities'}
      responses:
        '204':
          description: 'Recorded.'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Banned'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/state:
    parameters:
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [account]
      operationId: getState
      summary: 'Snapshot of everything live.'
      description: 'Used at start and after an event stream could not be resumed (api.md Account, GET /v1/state).'
      security:
        - bearer: []
      responses:
        '200':
          description: 'The state snapshot.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/State'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Banned'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [account]
      operationId: getUser
      summary: 'Public view of another account.'
      description: 'User plus `friend` and `blocked` flags (api.md Account, GET /v1/users/{user_id}).'
      security:
        - bearer: []
      responses:
        '200':
          description: 'The user.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserProfile'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Banned'
        '404':
          $ref: '#/components/responses/Error'
          description: '`not_found`: unknown or erased user.'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  # ---------------------------------------------------------------- events

  /v1/events:
    parameters:
      - $ref: '#/components/parameters/KalamarProtocol'
    get:
      tags: [events]
      operationId: openEventStream
      summary: 'Open the event WebSocket.'
      description: 'WebSocket upgrade (RFC 6455) carrying server pushes; frames, heartbeat, resume and event types are in events.md.'
      security:
        - bearer: []
        - {}
      parameters:
        - name: ticket
          in: query
          required: false
          description: 'Single-use ticket of POST /v1/events/ticket (valid 60 s), instead of the bearer header.'
          schema: {type: string}
        - name: resume
          in: query
          required: false
          description: 'Stream id to resume (`hello.stream`, events.md section 4).'
          schema: {type: string}
        - name: last_seq
          in: query
          required: false
          description: 'Last event `seq` the client processed, with `resume`.'
          schema: {type: integer, minimum: 0}
      responses:
        '101':
          description: 'Switching Protocols: the event stream of events.md starts with a `hello` message.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Banned'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/events/ticket:
    parameters:
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      tags: [events]
      operationId: createEventTicket
      summary: 'Get a single-use ticket for the WebSocket upgrade.'
      description: 'For clients that cannot set headers on the upgrade; valid 60 s (events.md section 1).'
      security:
        - bearer: []
      responses:
        '200':
          description: 'The ticket.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventTicket'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Banned'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  # ---------------------------------------------------------------- matches

  /v1/matches/current:
    parameters:
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [matches]
      operationId: getCurrentMatch
      summary: 'The current (non-terminal) match of the caller.'
      description: 'A player is in at most one match between `pending_accept` and its end (api.md Matches, Lifecycle).'
      security:
        - bearer: []
      responses:
        '200':
          description: 'The match, or `null`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentMatch'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Banned'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/matches/{match_id}:
    parameters:
      - $ref: '#/components/parameters/MatchId'
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [matches]
      operationId: getMatch
      summary: 'A match.'
      description: 'Participant view, or (with `stats`) the public view of an ended match (api.md Matches, Match object).'
      security:
        - bearer: []
      responses:
        '200':
          description: 'The match.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Match'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Banned'
        '404':
          $ref: '#/components/responses/Error'
          description: '`not_found`, also for a non-participant asking for a match that has not ended.'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/matches/{match_id}/accept:
    parameters:
      - $ref: '#/components/parameters/MatchId'
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      tags: [queues]
      operationId: acceptMatch
      summary: 'Accept a found match (idempotent).'
      description: 'Answer before `deadlines.accept` (api.md Queues, Matchmaking and the accept phase).'
      security:
        - bearer: []
      responses:
        '200':
          description: 'The match.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Match'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Banned'
        '404':
          $ref: '#/components/responses/Error'
          description: '`not_found` or `feature_disabled`.'
        '409':
          $ref: '#/components/responses/Error'
          description: '`match_state`: the match is not `pending_accept`.'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/matches/{match_id}/decline:
    parameters:
      - $ref: '#/components/parameters/MatchId'
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      tags: [queues]
      operationId: declineMatch
      summary: 'Decline a found match, or abandon its draft.'
      description: 'Cancels the match and counts as an offence (api.md Queues, Matchmaking and the accept phase). 1.1.6: during `drafting` it abandons the match (`cancel_reason: left`, draft.md section 1).'
      security:
        - bearer: []
      responses:
        '200':
          description: 'The match.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Match'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Banned'
        '404':
          $ref: '#/components/responses/Error'
          description: '`not_found` or `feature_disabled`.'
        '409':
          $ref: '#/components/responses/Error'
          description: '`match_state`: the match is not `pending_accept` (nor `drafting`).'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/matches/{match_id}/draft:
    parameters:
      - $ref: '#/components/parameters/MatchId'
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      tags: [draft]
      operationId: actOnDraft
      summary: 'Ban, pick or vote on the current turn of the match draft.'
      description: 'One player action on the turn `turn` (draft.md section 4). Idempotent: the same action again answers 200 without change.'
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DraftAction'}
      responses:
        '200':
          description: 'The match (participant view) after the action.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Match'}
        '400':
          $ref: '#/components/responses/Error'
          description: '`invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
          description: '`not_your_turn` (the other team turn, or the caller may not act for the team; `text` explains) or `banned`.'
        '404':
          $ref: '#/components/responses/Error'
          description: '`not_found` (not a participant) or `feature_disabled`.'
        '409':
          $ref: '#/components/responses/Error'
          description: '`draft_turn` (not the current turn, or the team already chose: refetch) or `match_state` (no draft, or it is over).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Error'
          description: '`validation_failed` on `/choices`: wrong count, an unknown, unavailable or repeated option id.'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/spectate:
    parameters:
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [spectators]
      operationId: listWatchable
      summary: 'The matches and series the caller may watch, before their launch.'
      description: 'A match is listed only before its launch (a match already started cannot be joined: a limit of the game), only to callers its places are for, never when a player refuses to be watched (unless the caller is a referee), never a room match (spectators.md section 3.2).'
      security:
        - bearer: []
      responses:
        '200':
          description: 'Oldest first, at most 100.'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Watchable'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
          description: '`feature_disabled`.'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/matches/{match_id}/spectate:
    parameters:
      - $ref: '#/components/parameters/MatchId'
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      tags: [spectators]
      operationId: takeSpectatorPlace
      summary: 'Take a place in the stands of a match not launched yet.'
      description: 'Idempotent. A game of a series seats for the series. Every participant must declare `engine.spectator_seats` and `launcher.spectate` (spectators.md section 2).'
      security:
        - bearer: []
      responses:
        '200':
          description: 'The match, the caller spectator view (`you.team: spectator`).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Match'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
          description: '`spectators_not_allowed` (`details.who`), `spectators_refused`, `blocked`.'
        '404':
          $ref: '#/components/responses/Error'
          description: '`not_found` (no such match, no places, a room match) or `feature_disabled`.'
        '409':
          $ref: '#/components/responses/Error'
          description: '`match_started`, `spectators_full`, `incompatible_game` (`details.players[].missing`), `in_match`, `already_in_queue`.'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'
    delete:
      tags: [spectators]
      operationId: leaveSpectatorPlace
      summary: 'Leave a place in the stands.'
      description: 'Before the launch the place is free again; after it the spectator is `left` (its launcher closes its game). Nothing is held against anyone.'
      security:
        - bearer: []
      responses:
        '204':
          description: 'Left.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
          description: '`not_found`.'
        default:
          $ref: '#/components/responses/Default'

  /v1/series/{series_id}/spectate:
    parameters:
      - $ref: '#/components/parameters/SeriesId'
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      tags: [spectators]
      operationId: takeSeriesSpectatorPlace
      summary: 'Take a place in the stands of a series: it holds for the next games until it is left.'
      security:
        - bearer: []
      responses:
        '200':
          description: 'The series, with `spectators`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Series'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
          description: '`spectators_not_allowed`, `spectators_refused`, `blocked`.'
        '404':
          $ref: '#/components/responses/Error'
          description: '`not_found` or `feature_disabled`.'
        '409':
          $ref: '#/components/responses/Error'
          description: '`spectators_full`, `incompatible_game`, `in_match` (a player of the series), `already_in_queue`.'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'
    delete:
      tags: [spectators]
      operationId: leaveSeriesSpectatorPlace
      summary: 'Leave a series stands (and the current game, if the place was taken there).'
      security:
        - bearer: []
      responses:
        '204':
          description: 'Left.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
          description: '`not_found`.'
        default:
          $ref: '#/components/responses/Default'

  /v1/operator/matches/{match_id}/spectators:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    post:
      tags: [operator, spectators]
      operationId: operatorSeatReferee
      summary: 'Seat a referee account in a match not launched yet (scope `results`).'
      description: 'A place whoever it is reserved for, flagged `referee`; the referee watches with its own launcher (operators.md section 2, spectators.md section 3.3).'
      security:
        - operator: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: {$ref: '#/components/schemas/Id'}
      responses:
        '204':
          description: 'Seated.'
        '403':
          $ref: '#/components/responses/Error'
          description: '`forbidden` (scope).'
        '404':
          $ref: '#/components/responses/Error'
          description: '`not_found` or `feature_disabled`.'
        '409':
          $ref: '#/components/responses/Error'
          description: '`match_started`, `spectators_full`, `incompatible_game`, `in_match`.'
        default:
          $ref: '#/components/responses/Default'

  /v1/operator/series/{series_id}/spectators:
    parameters:
      - $ref: '#/components/parameters/SeriesId'
    post:
      tags: [operator, spectators]
      operationId: operatorSeatRefereeSeries
      summary: 'Seat a referee account for a series next games (scope `results`).'
      security:
        - operator: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: {$ref: '#/components/schemas/Id'}
      responses:
        '204':
          description: 'Seated.'
        '403':
          $ref: '#/components/responses/Error'
          description: '`forbidden` (scope).'
        '404':
          $ref: '#/components/responses/Error'
          description: '`not_found` or `feature_disabled`.'
        '409':
          $ref: '#/components/responses/Error'
          description: '`spectators_full`, `incompatible_game`, `in_match`.'
        default:
          $ref: '#/components/responses/Default'

  /v1/matches/{match_id}/launch:
    parameters:
      - $ref: '#/components/parameters/MatchId'
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      tags: [matches]
      operationId: reportLaunch
      summary: 'Report that the game was started (idempotent).'
      description: 'Sent as soon as the game process started, before `deadlines.launch`; 1.1 adds the applied loadout (match-contract.md section 3, match-contract-2.md section 5).'
      security:
        - bearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LaunchReport'}
      responses:
        '200':
          description: 'The match.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Match'}
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Banned'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Error'
          description: '`match_state`: the match is not `ready` or `running`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/matches/{match_id}/status:
    parameters:
      - $ref: '#/components/parameters/MatchId'
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      tags: [matches]
      operationId: mirrorStatus
      summary: 'Mirror the game status file.'
      description: 'Sent verbatim at every change of state, at most 2 per second (api.md Matches, Status mirror).'
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StatusFile'}
      responses:
        '204':
          description: 'Recorded.'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Banned'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Error'
          description: '`match_state`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Error'
          description: '`validation_failed`: the body is not an object with a string `state`.'
        '429':
          $ref: '#/components/responses/RateLimited'
          description: '`rate_limited`: the server MAY drop statuses sent faster than 2 per second.'
        default:
          $ref: '#/components/responses/Default'

  /v1/matches/{match_id}/result:
    parameters:
      - $ref: '#/components/parameters/MatchId'
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      tags: [matches]
      operationId: uploadResult
      summary: 'Upload the result file, or a launcher error report.'
      description: 'Recorded whatever it contains; the decision follows api.md Result decision (api.md Matches, Result upload).'
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResultUpload'}
      responses:
        '200':
          description: 'Report recorded; an identical repeat also gets 200.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResultReceipt'}
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Banned'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Error'
          description: '`match_state` (the match ended) or `already_reported` (a different report was already received).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  # ---------------------------------------------------------------- queues

  /v1/queues:
