        '404':
          $ref: '#/components/responses/Error'
          description: '`not_found` or `feature_disabled`.'
        '409':
          $ref: '#/components/responses/Error'
          description: '`queue_closed`, `already_in_queue`, `in_match`, `party_size` or `in_room`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/tickets/current:
