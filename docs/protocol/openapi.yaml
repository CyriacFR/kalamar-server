      security:
        - bearer: []
      responses:
        '200':
          description: 'The queue.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Queue'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Banned'
        '404':
          $ref: '#/components/responses/Error'
