        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/queues/{queue_id}/tickets:
    parameters:
      - $ref: '#/components/parameters/QueueId'
      - $ref: '#/components/parameters/KalamarProtocol'
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      tags: [queues]
      operationId: joinQueue
      summary: 'Join a queue, solo or for the whole party when the caller leads one.'
      description: 'See api.md Queues, Endpoints.'
      security:
        - bearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmptyObject'}
      responses:
        '201':
          description: 'The ticket.'
