            application/json:
              schema: {$ref: '#/components/schemas/Room'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Banned'
        '404':
          $ref: '#/components/responses/Error'
