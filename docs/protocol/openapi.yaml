        '403':
          $ref: '#/components/responses/Banned'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/queues/{queue_id}:
    parameters:
      - $ref: '#/components/parameters/QueueId'
