      summary: 'Matches, including `under_review` (paginated).'
      description: 'Scope `read` (operators.md section 2).'
      security:
        - botBearer: [read]
      parameters:
        - name: state
          in: query
          required: false
          description: 'Only matches in this state, for example `under_review`.'
          schema: {type: string, examples: [under_review, running, completed, void]}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 'A page of matches.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatchPage'}
        '400':
          $ref: '#/components/responses/BadCursor'
        '401':
          $ref: '#/components/responses/BotUnauthorized'
        '403':
          $ref: '#/components/responses/BotForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/operator/matches/{match_id}:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    get:
      tags: [operator]
      operationId: operatorGetMatch
      summary: 'A match with every report (the raw files).'
      description: 'Scope `read` (operators.md section 2).'
      security:
        - botBearer: [read]
      responses:
        '200':
          description: 'The match and its reports.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatorMatch'}
        '401':
