      operationId: getPopulation
      summary: 'How many players are online, in a match and searching (1.1.4).'
      description: 'Public, no identity, no detail per queue or room; computed at most every 10 s (api.md Population).'
      security: []
      responses:
        '200':
          description: 'The counts.'
          headers:
            Cache-Control:
              description: '`max-age=10`: the same answer is served for 10 seconds.'
              schema: {type: string, examples: ['max-age=10']}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Population'}
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: the server does not declare `population` (the same answer as a server that never heard of it).'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

