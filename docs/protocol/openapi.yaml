        '403':
          $ref: '#/components/responses/Banned'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'
    delete:
      tags: [queues]
      operationId: cancelTicket
      summary: 'Cancel the current ticket, for every member of it.'
      description: 'Any member of the ticket may cancel it (api.md Queues, Endpoints).'
      security:
        - bearer: []
      responses:
        '204':
          description: 'Cancelled.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Banned'
        '404':
          $ref: '#/components/responses/Error'
          description: '`not_found` (no current ticket) or `feature_disabled`.'
        '409':
          $ref: '#/components/responses/Error'
          description: '`match_found`: too late, answer the match.'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

