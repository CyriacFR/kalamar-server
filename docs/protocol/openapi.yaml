    parameters:
      - $ref: '#/components/parameters/MatchId'
    post:
      tags: [operator]
      operationId: operatorDecideMatch
      summary: 'Decide or override the outcome of a match (referee).'
      description: 'The decision becomes `admin` and applies like any decision; an override first reverses rating changes (scope `results`, operators.md section 2).'
      security:
        - botBearer: [results]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OperatorDecision'}
      responses:
        '2XX':
          description: 'Applied; operators.md does not specify the status or the body.'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/BotUnauthorized'
        '403':
          $ref: '#/components/responses/BotForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/operator/reports:
    get:
      tags: [operator]
      operationId: operatorListReports
      summary: 'Reports filed by players (paginated).'
      description: 'Scope `moderation` (operators.md section 2).'
      security:
        - botBearer: [moderation]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 'A page of reports.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatorReportPage'}
        '400':
          $ref: '#/components/responses/BadCursor'
        '401':
          $ref: '#/components/responses/BotUnauthorized'
        '403':
          $ref: '#/components/responses/BotForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/operator/reports/{report_id}/resolve:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    post:
      tags: [operator]
      operationId: operatorResolveReport
      summary: 'Mark a report as resolved.'
      description: 'Scope `moderation`; operators.md does not specify a body (operators.md section 2).'
      security:
        - botBearer: [moderation]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: 'Not specified by operators.md.'
      responses:
        '2XX':
          description: 'Resolved; operators.md does not specify the status or the body.'
        '401':
          $ref: '#/components/responses/BotUnauthorized'
        '403':
          $ref: '#/components/responses/BotForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/operator/users/{user_id}/ban:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [operator]
      operationId: operatorBanUser
      summary: 'Ban a player, until a time or permanently.'
      description: 'The ban shows as a restriction of the player (scope `moderation`, operators.md section 2).'
      security:
        - botBearer: [moderation]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OperatorBan'}
      responses:
        '2XX':
          description: 'Banned; operators.md does not specify the status or the body.'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/BotUnauthorized'
        '403':
          $ref: '#/components/responses/BotForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/operator/users/{user_id}/unban:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [operator]
      operationId: operatorUnbanUser
      summary: 'Lift the ban of a player.'
      description: 'Scope `moderation`; operators.md does not specify a body (operators.md section 2).'
      security:
        - botBearer: [moderation]
      responses:
        '2XX':
          description: 'Unbanned; operators.md does not specify the status or the body.'
        '401':
          $ref: '#/components/responses/BotUnauthorized'
        '403':
          $ref: '#/components/responses/BotForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /v1/operator/activities/{activity_id}/actions/{action_id}:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
      - $ref: '#/components/parameters/ActionId'
    post:
      tags: [operator]
      operationId: operatorRunActivityAction
      summary: 'Run an organizer action of an activity (start, seed, disqualify).'
      description: 'Scope `activities`; operators.md does not specify the body or the answer (operators.md section 2).'
      security:
        - botBearer: [activities]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: 'Not specified by operators.md.'
      responses:
        '2XX':
          description: 'Done; operators.md does not specify the status or the body.'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/BotUnauthorized'
        '403':
          $ref: '#/components/responses/BotForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

components:

  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 'Opaque access token of a session, at most 512 characters (api.md Authentication, Tokens).'
    botBearer:
      type: http
      scheme: bearer
      description: 'Operator-created bot token with scopes `read`, `results`, `moderation`, `activities`, listed as roles in each requirement (operators.md section 2).'

  parameters:
    KalamarProtocol:
      name: Kalamar-Protocol
      in: header
      required: false
      description: 'Highest 1.x protocol version the launcher supports (overview.md section 5).'
      schema: {type: string, examples: ['1.0']}
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: 'Languages of the player; the server MAY reduce localized text to them.'
      schema: {type: string}
    Provider:
      name: provider
      in: path
      required: true
      description: 'The `id` of a login provider of `auth.providers`.'
      schema: {type: string}
    UserId:
      name: user_id
      in: path
      required: true
      description: 'A user id.'
      schema: {$ref: '#/components/schemas/Id'}
    RoomId:
      name: room_id
      in: path
      required: true
      description: 'A room id.'
      schema: {$ref: '#/components/schemas/Id'}
    MatchId:
      name: match_id
      in: path
      required: true
      description: 'A match id (the `id` of the match object, not `game.match_id`).'
      schema: {$ref: '#/components/schemas/Id'}
    PartyId:
      name: party_id
      in: path
      required: true
      description: 'A party id.'
      schema: {$ref: '#/components/schemas/Id'}
    QueueId:
      name: queue_id
      in: path
      required: true
      description: 'A queue id.'
      schema: {$ref: '#/components/schemas/Id'}
    LadderId:
      name: ladder_id
      in: path
      required: true
      description: 'A ladder id.'
      schema: {$ref: '#/components/schemas/Id'}
    RequestId:
      name: request_id
      in: path
      required: true
      description: 'A friend request id.'
      schema: {$ref: '#/components/schemas/Id'}
    ActivityId:
      name: activity_id
      in: path
      required: true
      description: 'An activity id (1.1).'
      schema: {$ref: '#/components/schemas/Id'}
    ActionId:
      name: action_id
      in: path
      required: true
      description: 'An action id of the view (1.1).'
      schema: {type: string, minLength: 1}
    SeriesId:
      name: series_id
      in: path
      required: true
      description: 'A series id (1.1).'
      schema: {$ref: '#/components/schemas/Id'}
    ReportId:
      name: report_id
      in: path
      required: true
      description: 'A report id (1.1, operator API).'
      schema: {$ref: '#/components/schemas/Id'}
    Season:
      name: season
      in: query
      required: false
      description: 'A season id; default: the current season.'
      schema: {$ref: '#/components/schemas/Id'}
    Limit:
      name: limit
      in: query
      required: false
      description: 'Page size (api.md Pagination).'
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Cursor:
      name: cursor
      in: query
      required: false
      description: 'Opaque `next_cursor` of the previous page; MAY expire.'
      schema: {type: string, maxLength: 256}

  headers:
    RetryAfter:
      description: 'Seconds to wait before retrying; the same number as `retry_after_s`.'
      schema: {type: integer, minimum: 0}
    KalamarSignature:
      description: '1.1 webhooks: `t=<unix seconds>,v1=<hex HMAC-SHA-256(secret, "<t>." + body)>`; receivers reject a timestamp more than 5 minutes off (operators.md section 1).'
      schema: {type: string, pattern: '^t=[0-9]+,v1=[0-9a-f]{64}$'}

  responses:
    Error:
      description: 'An error (api.md Error codes).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Default:
      description: 'Any other error of api.md Error codes, for example `internal` (500) or `unavailable` (503).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: '`unauthorized` or `session_revoked` (log in again), or `token_expired` (refresh, then retry).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Banned:
      description: '`banned`, with `retry_after_s` when temporary (api.md Moderation, Bans).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    FeatureDisabled:
      description: '`feature_disabled`: the area is not declared in `features` (overview.md section 2).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: '`not_found`: no such object, or not visible to the caller (api.md Conventions).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFoundOrDisabled:
      description: '`not_found` (no such object, or not visible to the caller) or `feature_disabled` (undeclared area).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BotUnauthorized:
      description: '`unauthorized`: missing, unknown or revoked bot token (operators.md section 2).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BotForbidden:
      description: 'The bot token lacks the scope of the endpoint; operators.md names no code (`forbidden` is the generic one).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InvalidJson:
      description: '`invalid_json`: the body is not JSON or not the expected JSON type.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BadCursor:
      description: '`bad_cursor`: unknown or expired cursor; start again without one.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: '`payload_too_large`: the body is over the `limits` of GET /v1/meta.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ValidationFailed:
      description: '`validation_failed`: a member has a bad value (`field` names it).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: '`rate_limited`: wait at least `retry_after_s` before retrying (api.md Rate limits).'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

  schemas:

    # ------------------------------------------------------------ primitives

    Id:
      type: string
      description: 'Opaque case-sensitive identifier, never reused and never a fixed path segment; clients never parse it (api.md Identifiers).'
      pattern: '^(?!(current|join|requests|invites|tickets|me)$)[A-Za-z0-9_-]{1,64}$'
    NullableId:
      type: [string, 'null']
      description: 'An Id, or `null`.'
      pattern: '^(?!(current|join|requests|invites|tickets|me)$)[A-Za-z0-9_-]{1,64}$'
    GameIdentifier:
      type: string
      minLength: 1
      description: 'A mode or stage id as the game itself uses it (match-contract.md, Mode and stage identifiers).'
    Team:
      type: string
      description: 'A team: `alpha` or `bravo` (open); `spectator` is reserved and assigned only when every participant declares `spectators` (match-contract-2.md section 1).'
      examples: [alpha, bravo]
    TeamSizes:
      type: array
      description: 'Team sizes `[alpha, bravo]`.'
      items: {type: integer, minimum: 1}
      minItems: 2
      maxItems: 2
      examples: [[4, 4]]
    LocalizedText:
      type: object
      description: 'Language tag (BCP 47) to plain text; show the best match, else `en`, else any (api.md Localized text).'
      additionalProperties: {type: string}
      examples:
        - {en: 'Ranked duel', fr: 'Duel classe'}
    MemberName:
      type: string
      description: 'Name in the game and on the relay: at most 32 UTF-8 bytes, no leading or trailing space, unique case-insensitively in the match (match-contract.md, Member names).'
      minLength: 1
      maxLength: 10
      pattern: '^[^\x00-\x1F\x7F,:="]+$'
    EmptyObject:
      type: object
      description: 'An empty object, `{}`.'

    # ------------------------------------------------------------ errors

    Error:
      type: object
      description: 'Body of every error (overview.md section 6, api.md Error codes).'
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, field, retry_after_s]
          properties:
            code: {$ref: '#/components/schemas/ErrorCode'}
            message:
              type: string
              description: 'English sentence for logs and developers; clients branch on `code`.'
            field:
              type: [string, 'null']
              description: 'JSON pointer of the offending request member, with `validation_failed`.'
            retry_after_s:
              type: [number, 'null']
              minimum: 0
              description: 'Seconds to wait, with `rate_limited`, `queue_cooldown`, temporary `banned` and `name_change_too_soon`.'
            details:
              type: [object, 'null']
              description: 'Code-specific data: `requirements` with `not_eligible`; 1.1 `players` with `incompatible_game`.'
              properties:
                requirements:
                  type: array
                  items: {$ref: '#/components/schemas/Requirement'}
                players:
                  type: array
                  description: '1.1: what each participant game lacks (match-contract-2.md section 3).'
                  items: {$ref: '#/components/schemas/MissingCapabilities'}
            text:
              $ref: '#/components/schemas/LocalizedText'
              description: '1.1.5, optional: the same as `message` for the player; shown when the launcher has no text of its own for the code.'
      examples:
        - error: {code: room_full, message: 'the room is full', field: null, retry_after_s: null}
    ErrorCode:
      type: string
      description: 'Stable machine-readable code (api.md Error codes); open, an unknown code is handled by its HTTP status.'
      examples:
        - invalid_json
        - bad_request
        - bad_cursor
        - invalid_state
        - pkce_mismatch
        - unauthorized
        - token_expired
        - session_revoked
        - forbidden
        - banned
        - blocked
        - not_friends
        - not_leader
        - not_owner
        - wrong_password
        - kicked
        - not_eligible
        - queue_cooldown
        - private_profile
        - not_found
        - feature_disabled
        - conflict
        - already_in_party
        - party_full
        - party_busy
        - party_size
        - already_in_room
        - room_full
        - team_full
        - room_state
        - not_ready
        - not_enough_players
        - already_in_queue
        - queue_closed
        - match_found
        - in_room
        - in_match
        - match_state
        - already_reported
        - incompatible_game
        - stale_view
        - action_unavailable
        - not_your_turn
        - draft_turn
        - already_friends
        - request_exists
        - friend_limit
        - name_change_too_soon
        - display_name_taken
        - account_exists
        - payload_too_large
        - validation_failed
        - code_required
        - rate_limited
        - internal
        - provider_error
        - unavailable
        - relay_capacity

    # ------------------------------------------------------------ discovery

    DiscoveryDocument:
      type: object
      description: 'Discovery document of a server (server-card.md section 2).'
      required: [kalamar_server, name, api, relay, protocol, features, operator, rules_url, privacy_url]
      properties:
        kalamar_server:
          type: integer
          const: 1
          description: 'Format of this document; a launcher refuses other values.'
        name:
          type: string
          minLength: 1
          maxLength: 64
        description: {$ref: '#/components/schemas/LocalizedText'}
        api:
          type: string
          format: uri
          maxLength: 200
          description: 'Base URL of the API, `https://host[:port][/path]`, without user info, query or fragment.'
          examples: ['https://play.example.org/api']
        relay:
          type: [string, 'null']
          description: 'Default relay `host[:port]` (UDP, default port 47313), informational; `null` when relays are per match only.'
          examples: ['relay.example.org:47313']
        protocol: {$ref: '#/components/schemas/ProtocolVersions'}
        features: {$ref: '#/components/schemas/Features'}
        operator: {$ref: '#/components/schemas/Operator'}
        rules_url:
          type: [string, 'null']
          format: uri
          description: 'The rules of the community for humans.'
        privacy_url:
          type: string
          format: uri
          description: 'The privacy notice.'
        region:
          type: string
          maxLength: 32
          description: 'Free text shown as a hint.'
        languages:
          type: array
          description: 'Language tags the community uses.'
          items: {type: string}
    ProtocolVersions:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          description: 'Protocol versions served.'
          items: {type: string, examples: ['1.0', '1.1']}
    Features:
      type: array
      description: 'Declared optional areas (overview.md section 2); open, unknown ids are ignored.'
      items:
        type: string
        examples: [rooms, queues, parties, friends, presence, ratings, leaderboards, stats, moderation, test-clock, activities, series, badges, profiles, population]
    Operator:
      type: object
      required: [name, contact]
      properties:
        name:
          type: string
          maxLength: 64
          description: 'Who runs the server.'
        contact:
          type: string
          maxLength: 200
          description: 'A `mailto:` or `https:` URI.'

    # ------------------------------------------------------------ meta

    Meta:
      type: object
      description: 'Everything the service offers (api.md Meta).'
      required: [name, protocol, time, features, relay, operator, privacy_url, game_contract, limits, auth, rules, result_policies]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description: {$ref: '#/components/schemas/LocalizedText'}
        protocol: {$ref: '#/components/schemas/ProtocolVersions'}
        software:
          type: object
          description: 'Free text about the implementation.'
          required: [name, version]
          properties:
            name: {type: string}
            version: {type: string}
        time:
          type: string
          format: date-time
          description: 'The clock of the server; countdowns are computed from it.'
        features: {$ref: '#/components/schemas/Features'}
        relay:
          type: [string, 'null']
          description: 'Default relay `host[:port]` (informational).'
        relays:
          type: array
          maxItems: 16
          description: '1.1.9: every relay a match may be given (relay.md, 4.1). A launcher may measure its round trip to each and declare it in `PUT /v1/me/game` (`launcher.relay_rtt_ms`).'
          items:
            type: object
            required: [id, host, port]
            properties:
              id: {type: string, minLength: 1, maxLength: 260}
              host: {type: string, description: 'DNS name or IPv4 address.'}
              port: {type: integer, minimum: 1, maximum: 65535}
              region: {type: string}
              label: {$ref: '#/components/schemas/LocalizedText'}
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: '1.1.9: an opaque number that grows each time the offer changes while the server runs (event `meta.changed`, whose data carries the new value), and from one start of the server to the next as long as its clock moves forward (the reference server: its clock in milliseconds at the last change). Launchers only compare it.'
          examples: [1794441600000]
        operator: {$ref: '#/components/schemas/Operator'}
        privacy_url: {type: string, format: uri}
        game_contract: {$ref: '#/components/schemas/GameContract'}
        limits: {$ref: '#/components/schemas/Limits'}
        auth:
          type: object
          required: [providers]
          properties:
            providers:
              type: array
              minItems: 1
              items: {$ref: '#/components/schemas/ProviderInfo'}
        rules: {$ref: '#/components/schemas/Rules'}
        result_policies:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ResultPolicy'}
        catalog: {$ref: '#/components/schemas/Catalog'}
        rooms: {$ref: '#/components/schemas/RoomDeclaration'}
        queues:
          type: object
          description: 'With area `queues`.'
          required: [count, penalties]
          properties:
            count:
              type: integer
              minimum: 0
              description: 'Number of queues; the list is GET /v1/queues.'
            penalties: {$ref: '#/components/schemas/Penalties'}
        moderation:
          type: object
          description: 'With area `moderation`.'
          required: [report_categories]
          properties:
            report_categories:
              type: array
              items: {$ref: '#/components/schemas/IdLabel'}
        operator_api:
          type: object
          description: '1.1, optional: the operator interfaces offered (operators.md).'
          required: [webhooks, bot_api, referee]
          properties:
            webhooks: {type: boolean}
            bot_api: {type: boolean}
            referee: {type: boolean}
        matches:
          type: object
          description: '1.1.10, optional: `free_after_report` true: a participant whose terminal report is in is free of a match that waits for the others (api.md, Lifecycle).'
          properties:
            free_after_report: {type: boolean}
    GameContract:
      type: object
      description: 'A match contract and its versions: produced by the server in meta, implemented by the launcher in 1.1 `contracts` (match-contract.md, match-contract-2.md).'
      required: [id, versions]
      properties:
        id: {type: string, examples: [lan-auto-match]}
        versions:
          type: array
          items: {type: integer, examples: [1, 2]}
    ContractRef:
      type: object
      description: 'One version of a match contract.'
      required: [id, version]
      properties:
        id: {type: string, examples: [lan-auto-match]}
        version: {type: integer, examples: [1]}
    Limits:
      type: object
      description: 'Size and count limits of the server (api.md Meta, Requests and responses).'
      required: [body_bytes, result_bytes, status_bytes, display_name]
      properties:
        body_bytes: {type: integer, minimum: 16384}
        result_bytes: {type: integer, minimum: 65536}
        status_bytes: {type: integer, minimum: 4096}
        display_name:
          type: object
          description: 'Length bounds in Unicode scalar values.'
          required: [min_len, max_len]
          properties:
            min_len: {type: integer, minimum: 0}
            max_len: {type: integer, minimum: 0}
        friends: {type: integer, minimum: 0}
        party_size: {type: integer, minimum: 1}
    Rules:
      type: object
      description: 'Rules block: human rules of the community (api.md Meta, Rules block).'
      required: [url, summary]
      properties:
        url:
          type: [string, 'null']
          format: uri
        summary: {$ref: '#/components/schemas/LocalizedText'}
        sections:
          type: array
          items: {$ref: '#/components/schemas/RuleSection'}
    RuleSection:
      type: object
      required: [id, title, body]
      properties:
        id: {type: string}
        title: {$ref: '#/components/schemas/LocalizedText'}
        body: {$ref: '#/components/schemas/LocalizedText'}
    Catalog:
      type: object
      description: 'Display names for game ids, used only when the launcher cannot resolve an id; never a list of what exists.'
      required: [modes, stages]
      properties:
        modes:
          type: array
          items: {$ref: '#/components/schemas/IdLabel'}
        stages:
          type: array
          items: {$ref: '#/components/schemas/IdLabel'}
    IdLabel:
      type: object
      required: [id, label]
      properties:
        id: {type: string}
        label: {$ref: '#/components/schemas/LocalizedText'}
    Field:
      type: object
      description: 'A server-declared form field, for login forms and room options (api.md Common objects, Field).'
      required: [key, type, label, required]
      properties:
        key:
          type: string
          description: 'Member name in the request.'
        type:
          type: string
          description: 'Open; unknown type: the launcher hides the field if not `required`, else refuses the form.'
          examples: [string, integer, boolean, enum, teams, mode, stage]
        label: {$ref: '#/components/schemas/LocalizedText'}
        help: {$ref: '#/components/schemas/LocalizedText'}
        required:
          type: boolean
          description: 'The request MUST carry the member.'
        default:
          description: 'The value the form starts with (any JSON value).'
        nullable:
          type: boolean
          description: '`null` is allowed, named by `null_label`.'
        null_label: {$ref: '#/components/schemas/LocalizedText'}
        min:
          type: integer
          description: '`integer` range, inclusive.'
        max:
          type: integer
        min_len:
          type: integer
          minimum: 0
          description: '`string` length in Unicode scalar values.'
        max_len:
          type: integer
          minimum: 0
        secret:
          type: boolean
          description: '`string` shown masked.'
        values:
          type: array
          description: '`enum`, `mode`, `stage`: allowed values, in display order.'
          items: {$ref: '#/components/schemas/FieldValue'}
        by_mode:
          type: object
          description: '`stage` only: mode id to allowed stage ids, instead of `values`.'
          additionalProperties:
            type: array
            items: {$ref: '#/components/schemas/GameIdentifier'}
        choices:
          type: array
          description: '`teams` only: allowed team sizes.'
          items: {$ref: '#/components/schemas/TeamSizes'}
        autocomplete:
          type: string
          description: '1.1.5, optional: an HTML autocomplete token a launcher may pass to the system or a password manager; unknown values are ignored.'
          examples: [email, username, nickname, current-password, new-password, one-time-code]
    FieldValue:
      type: object
      required: [id]
      properties:
        id: {type: string}
        label: {$ref: '#/components/schemas/LocalizedText'}
    ProviderInfo:
      type: object
      description: 'A login provider (api.md Authentication, Providers).'
      required: [id, kind, label]
      properties:
        id:
          type: string
          description: 'Used in `/v1/auth/{provider}/...`; `dev` and `guest` are conventional.'
        kind:
          type: string
          description: 'Open; a launcher does not offer a provider of unknown kind.'
          examples: [direct, oauth_loopback]
        label: {$ref: '#/components/schemas/LocalizedText'}
        fields:
          type: array
          description: '`direct` only: the login form.'
          items: {$ref: '#/components/schemas/Field'}
        warning: {$ref: '#/components/schemas/LocalizedText'}
        loopback_redirects:
          type: array
          description: '`oauth_loopback` only: accepted redirect URIs, `http://127.0.0.1:<port>/<path>` or `http://[::1]:<port>/<path>`, by preference.'
          items: {type: string, format: uri}
        purpose:
          type: string
          description: '1.1.5, optional, `direct` only: what the form does (api.md Password accounts); unknown value: `login`.'
          examples: [login, signup, reset, change]
        group:
          type: string
          description: '1.1.5, optional: providers with the same group are forms of one account system.'
          examples: [password]
    ResultPolicy:
      type: object
      description: 'How reports become an outcome; unknown values: show `summary` only (api.md Result policies).'
      required: [id, name, summary, quorum, silence, disagreement, rated_requires_both_teams, abort, disconnect, no_show, deadlines]
      properties:
        id: {type: string}
        name: {$ref: '#/components/schemas/LocalizedText'}
        summary: {$ref: '#/components/schemas/LocalizedText'}
        quorum:
          type: [string, integer]
          minimum: 1
          description: 'Support a result needs: `any`, `majority`, `all`, or an integer k (at least min(k, participants)).'
          examples: [any, majority, all, 2]
        silence:
          type: string
          examples: [consent_after_play, ignore]
        disagreement:
          type: string
          examples: [majority, void, rematch]
        rated_requires_both_teams:
          type: boolean
          description: 'A rated match changes ratings only if each team confirmed the record (api.md Result decision, step 8). 1.1.12: a team confirms with a valid result of its own equal to the record, or a counted referee witness does for every team; a silence, an error or a spectator who is not a referee never confirm.'
        abort:
          type: string
          examples: [void, rematch]
        disconnect:
          type: string
          examples: [game_result, forfeit]
        no_show:
          type: string
          examples: [void, rematch]
        deadlines: {$ref: '#/components/schemas/PolicyDeadlines'}
        loadout_check:
          type: string
          description: '1.1.1, open enum: `ignore` (default), `void`, `forfeit`: rules.loadout checked against each player''s weapon and gear in the accepted record (match-contract-2.md section 5).'
          examples: [ignore]
        decider:
          type: string
          default: auto
          description: '1.1, optional: who decides; `referee` and `auto_then_referee` put matches `under_review`; `x-` values are the operator own (operators.md section 3).'
          examples: [auto, referee, auto_then_referee]
        review_deadline_s:
          type: number
          minimum: 0
          description: '1.1, optional: how long a match may stay `under_review` before the automatic decision applies.'
        witness:
          type: string
          default: ignore
          description: '1.1.7, optional, open enum: what spectators reports (witness reports) are used for: `ignore`, `tiebreak` (they break a disagreement between players), `required` (also: a rated result needs a counted witness agreeing; one contradicting voids it) (spectators.md section 6).'
          examples: [ignore, tiebreak, required]
        witness_from:
          type: string
          default: any
          description: '1.1.7, optional: whose reports count: `any` spectator or `referees`.'
          examples: [any, referees]
        stats:
          type: string
          default: strict
          description: '1.1.8, optional, open enum: what the reports' counters (the teams' scores and each player's statistics) weigh: `flag` (reports agree on what decides the match; counters compared with a wide tolerance, a larger gap flagged in `outcome.stats_check` without voiding), `ignore` (not compared), `strict` (every shared field equal). Absent: `strict` (api.md Result decision, step 2).'
          examples: [flag, ignore, strict]
        leave:
          type: string
          default: void
          description: '1.1.11, optional, open enum: what a player''s voluntary departure from a match in play does when the match has no valid result: `void` (the match is void, the rule up to 1.1.10), `forfeit` (the leaver''s team loses, counted and rated as any result), `forfeit_unrated` (it loses, no rating changes). Only a departure the leaver''s own launcher reports in play counts (`left-by-player` with `in_play: true`); a crash or a lost connection never does (api.md Result decision, step 3b; leaving.md). Absent: `void`.'
          examples: [void, forfeit, forfeit_unrated]
    PolicyDeadlines:
      type: object
      description: 'Seconds: `accept_s` (queue matches), `launch_s` and `result_s` after `ready`, `grace_s` after the first valid result.'
      required: [accept_s, launch_s, result_s, grace_s]
      properties:
        accept_s: {type: number, minimum: 0}
        launch_s: {type: number, minimum: 0}
        result_s: {type: number, minimum: 0}
        grace_s: {type: number, minimum: 0}
    RoomDeclaration:
      type: object
      description: 'How the room creation form looks and what a room may be (api.md Private rooms, Room declaration).'
      required: [options, min_players, result_policy, ladder, invites, idle_close_s]
      properties:
        options:
          type: array
          description: 'Fields of the creation form; keys `teams`, `mode`, `stage` and `password` are reserved.'
          items: {$ref: '#/components/schemas/Field'}
        min_players: {type: integer, minimum: 2}
        result_policy:
          type: string
          description: 'Id of a result policy.'
        ladder:
          $ref: '#/components/schemas/NullableId'
          description: '`null` (room matches are unrated) or a ladder id.'
        invites: {type: boolean}
        idle_close_s: {type: number, minimum: 0}
    Penalties:
      type: object
      description: 'Queue penalty declaration (api.md Queues, Penalties).'
      required: [summary, counted, window_s, cooldowns_s]
      properties:
        summary: {$ref: '#/components/schemas/LocalizedText'}
        counted:
          type: array
          description: 'Offences counted; open, unknown ones are explained by `summary`.'
          items:
            type: string
            examples: [decline, accept_timeout, no_show, left]
        window_s: {type: number, minimum: 0}
        cooldowns_s:
          type: array
          description: 'Cooldown after the (k+1)-th offence within `window_s`; the last entry repeats.'
          items: {type: number, minimum: 0}

    # ------------------------------------------------------------ authentication

    LoginFields:
      type: object
      description: 'The `fields` of a direct provider as members, for example `{"display_name": "Camille"}`.'
    OAuthBegin:
      type: object
      required: [redirect_uri, code_challenge, code_challenge_method]
      properties:
        redirect_uri:
          type: string
          format: uri
          description: 'Exactly one of `loopback_redirects`.'
        code_challenge:
          type: string
          description: 'BASE64URL-NOPAD(SHA-256(code_verifier)).'
          pattern: '^[A-Za-z0-9_-]{43}$'
        code_challenge_method:
          type: string
          examples: [S256]
    OAuthBeginAnswer:
      type: object
      required: [authorize_url, state, expires_at]
      properties:
        authorize_url: {type: string, format: uri}
        state:
          type: string
          description: 'Single-use; remembered for at most 10 minutes.'
        expires_at: {type: string, format: date-time}
    OAuthComplete:
      type: object
      required: [state, code, code_verifier]
      properties:
        state: {type: string}
        code:
          type: string
          description: 'The `code` of the redirect.'
        code_verifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: {type: string, maxLength: 512}
    LogoutRequest:
      type: object
      properties:
        all:
          type: boolean
          default: false
          description: '`true` revokes every session of the account.'
    Session:
      type: object
      description: 'Tokens returned by a login or a refresh (api.md Authentication, Tokens).'
      required: [access_token, access_expires_at, refresh_token, refresh_expires_at, created, me]
      properties:
        access_token:
          type: string
          maxLength: 512
          description: 'Opaque; sent as `Authorization: Bearer <token>`.'
        access_expires_at: {type: string, format: date-time}
        refresh_token:
          type: string
          maxLength: 512
          description: 'Opaque; replaced at each refresh.'
        refresh_expires_at: {type: string, format: date-time}
        created:
          type: boolean
          description: '`true` when the login created the account.'
        me: {$ref: '#/components/schemas/Me'}

    # ------------------------------------------------------------ account

    User:
      type: object
      description: 'Public view of an account (api.md Common objects).'
      required: [id, display_name]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        display_name: {type: string}
        badge:
          $ref: '#/components/schemas/BadgeRef'
          description: '1.1, optional: the featured badge, shown next to the name (presentation.md section 1).'
        title:
          $ref: '#/components/schemas/LocalizedText'
          description: '1.1, optional: the chosen title, shown next to the name.'
    UserProfile:
      description: 'A User plus relationship flags (api.md Account, GET /v1/users/{user_id}).'
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            friend:
              type: boolean
              description: 'With area `friends`.'
            blocked:
              type: boolean
              description: 'With area `moderation`.'
    Me:
      type: object
      description: 'The account of the caller (api.md Account, Me object).'
      required: [id, display_name, created_at, logins, settings, display_name_change, restrictions]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        display_name: {type: string}
        created_at: {type: string, format: date-time}
        logins:
          type: array
          description: 'Provider ids linked to the account.'
          items: {type: string}
        friend_code:
          type: string
          description: 'With area `friends`.'
        settings: {$ref: '#/components/schemas/Settings'}
        display_name_change:
          type: object
          required: [allowed_at]
          properties:
            allowed_at:
              type: string
              format: date-time
              description: 'When the next rename is allowed.'
        restrictions:
          type: array
          description: 'Active restrictions.'
          items: {$ref: '#/components/schemas/Restriction'}
        featured_badge:
          type: [string, 'null']
          description: '1.1, area `badges`: id of the featured badge.'
        title:
          type: [string, 'null']
          description: '1.1, area `badges`: id of the chosen title (presentation.md section 1).'
        password:
          type: object
          description: '1.1.5, optional: the account has a password POST /v1/me/password changes (never the address).'
          required: [changed_at]
          properties:
            changed_at: {type: string, format: date-time}
    Settings:
      type: object
      description: 'Account settings; a server includes those it supports.'
      properties:
        share_presence:
          type: boolean
          description: 'Area `presence`.'
        allow_friend_requests:
          type: boolean
          description: 'Area `friends`.'
        public_profile:
          type: boolean
          description: 'Area `stats`: others see statistics and history.'
        show_on_leaderboards:
          type: boolean
          description: 'Area `leaderboards`.'
        allow_spectators:
          type: boolean
          description: '1.1.7, area `spectators` when the operator lets players refuse to be watched (spectators.md section 7).'
    Restriction:
      type: object
      description: 'An active restriction; unknown kind: show `reason` (api.md Account, Me object).'
      required: [kind, until, reason]
      properties:
        kind:
          type: string
          examples: [ban, queue_cooldown, chat]
        until:
          type: [string, 'null']
          format: date-time
          description: 'End of the restriction; `null` for a permanent ban.'
        reason: {$ref: '#/components/schemas/LocalizedText'}
    MeUpdate:
      type: object
      description: 'Every member optional.'
      properties:
        display_name: {type: string}
        settings: {$ref: '#/components/schemas/Settings'}
        featured_badge:
          type: [string, 'null']
          description: '1.1, area `badges`: a badge id of the caller, or `null`.'
        title:
          type: [string, 'null']
          description: '1.1, area `badges`: an unlocked title id, or `null`.'
    GameCapabilities:
      type: object
      description: 'What the game build and engine of the player support; a 1.0 body means contract 1 and nothing more (api.md Account, match-contract-2.md section 2).'
      required: [contract, build, modes, stages, can_select_stage, max_players]
      properties:
        contract: {$ref: '#/components/schemas/ContractRef'}
        contracts:
          type: array
          description: '1.1: every contract id and version the launcher implements.'
          items: {$ref: '#/components/schemas/GameContract'}
        build:
          type: string
          description: 'Opaque build id. 1.1.12: names a build, never an installation: the same value for every copy of the same game build (a version, a commit, a hash of the contents), never local file sizes, times or paths. A server SHOULD neither store nor log it beyond its use; the reference server ignores it.'
        engine: {$ref: '#/components/schemas/EngineCapabilities'}
        modes:
          type: array
          items: {$ref: '#/components/schemas/GameIdentifier'}
          examples: [['<mode id>', '<mode id>']]
        stages:
          type: array
          description: 'For contract 2: the stages of the room list of this player (only they can be picked when this player hosts).'
          items: {$ref: '#/components/schemas/GameIdentifier'}
          examples: [['<stage id>', '<stage id>']]
        can_select_stage:
          type: boolean
          description: 'The game can be told a stage.'
        max_players: {type: integer, minimum: 1}
        options:
          description: '1.1: the engine `--list-match-options` output verbatim, opaque to the protocol, at most 64 KiB.'
        launcher:
          type: object
          description: '1.1.6: what the launcher itself renders.'
          properties:
            draft:
              type: array
              description: 'Versions of the draft object the launcher shows (draft.md section 7); absent: the server plays the player team turns, or refuses a required draft.'
              items: {type: integer, minimum: 1}
            spectate:
              type: array
              description: '1.1.7: versions of the spectator seat the launcher runs (spectators.md section 2); absent: never seated, never in a match with spectators.'
              items: {type: integer, minimum: 1}
              examples: [[1]]
            relay_rtt_ms:
              type: object
              maxProperties: 16
              description: '1.1.9: the round trip the launcher measured to each relay of `meta.relays` (one relay protocol `HELLO` timed against its `CHALLENGE`), by relay `id`, in milliseconds; `null`: no answer within 2 seconds (relay.md 4.1). A launcher that measured sends every relay of the list; a server uses it only to choose the relay of the player''s matches, ignores unknown ids, and may bound the values or ignore a declaration that leaves relays out. Absent: nothing measured.'
              additionalProperties:
                type: [integer, 'null']
                minimum: 1
                maximum: 2000
              examples: [{eu: 24, us: 131, asia: null}]
    EngineCapabilities:
      type: object
      description: '1.1: what the engine accepts; unknown capability names are ignored by servers (match-contract-2.md section 2).'
      properties:
        rule_keys:
          type: array
          description: 'Rule keys of `KLM_MATCH_RULES` the engine accepts.'
          items: {type: string}
          examples: [[players, teams, mode, stage, results_hold]]
        rounds:
          type: boolean
          description: 'The engine plays several rounds in one session (`KLM_MATCH_CMD`).'
        max_players: {type: integer, minimum: 1}
        max_per_team: {type: integer, minimum: 1}
        uneven_teams: {type: boolean}
        spectators:
          type: boolean
          description: 'The engine knows the team letter S (informative: it never seats anyone, see `spectator_seats`).'
        spectator_seats:
          type: object
          description: '1.1.7: the engine places for spectators, from its `spectators` member; required of every participant of a match with spectators (spectators.md section 2).'
          properties:
            max: {type: integer, minimum: 0, maximum: 2}
            modes: {type: array, items: {type: string}}
            verified_modes: {type: array, items: {type: string}}
            host: {type: boolean}
        loadout:
          type: array
          description: 'Loadout constraints the launcher can apply.'
          items:
            type: string
            examples: [weapon, gear]
    MissingCapabilities:
      type: object
      description: '1.1: what a participant game lacks for a match, in `details.players` of `incompatible_game`.'
      required: [user_id, missing]
      properties:
        user_id: {$ref: '#/components/schemas/Id'}
        missing:
          type: array
          description: 'Open; unknown items are shown as text.'
          items:
            type: string
            examples: ['contract:2', 'rule_key:stage', rounds, 'players:8', 'per_team:4', uneven_teams, spectators, 'loadout:weapon', 'mode:<mode id>', 'stage:<stage id>', 'launcher:draft', 'launcher:spectate', 'spectators:2', 'spectator_mode:<mode id>', spectator_host]
    State:
      type: object
      description: 'Snapshot of everything live; members exist only for declared areas (api.md Account, GET /v1/state).'
      required: [me, match]
      properties:
        me: {$ref: '#/components/schemas/Me'}
        party:
          oneOf: [{$ref: '#/components/schemas/Party'}, {type: 'null'}]
        party_invites:
          type: array
          description: 'Pending incoming party invitations; they expire, ignoring one declines it.'
          items: {$ref: '#/components/schemas/PartyInvite'}
        room:
          oneOf: [{$ref: '#/components/schemas/Room'}, {type: 'null'}]
        room_invites:
          type: array
          description: 'Pending incoming room invitations; they expire, ignoring one declines it.'
          items: {$ref: '#/components/schemas/RoomInvite'}
        ticket:
          oneOf: [{$ref: '#/components/schemas/Ticket'}, {type: 'null'}]
        match:
          description: 'The current non-terminal match of the player.'
          oneOf: [{$ref: '#/components/schemas/Match'}, {type: 'null'}]
    EventTicket:
      type: object
      description: 'Single-use WebSocket ticket, valid 60 s (events.md section 1).'
      required: [ticket, expires_at]
      properties:
        ticket: {type: string}
        expires_at: {type: string, format: date-time}

    # ------------------------------------------------------------ friends

    Friend:
      type: object
      description: 'A friendship (api.md Friends and presence).'
      required: [user, since]
      properties:
        kind: {type: string, description: '1.1.1: `friend` (tells a Friend from a Request in the answer of POST /v1/friends/requests).'}
        user: {$ref: '#/components/schemas/User'}
        since: {type: string, format: date-time}
        presence:
          type: string
          description: 'Area `presence` only; open, an unknown value is shown as `online`.'
          examples: [online, in_queue, in_match, offline]
    FriendList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Friend'}
    FriendRequest:
      type: object
      description: 'A pending friend request; `user` is the other player.'
      required: [id, user, created_at]
      properties:
        kind: {type: string, description: '1.1.1: `request`.'}
        id: {$ref: '#/components/schemas/Id'}
        user: {$ref: '#/components/schemas/User'}
        created_at: {type: string, format: date-time}
    FriendRequests:
      type: object
      required: [incoming, outgoing]
      properties:
        incoming:
          type: array
          items: {$ref: '#/components/schemas/FriendRequest'}
        outgoing:
          type: array
          items: {$ref: '#/components/schemas/FriendRequest'}
    FriendRequestCreate:
      type: object
      required: [friend_code]
      properties:
        friend_code:
          type: string
          description: 'Compared case-insensitively; dashes and spaces are ignored.'
    FriendCode:
      type: object
      required: [friend_code]
      properties:
        friend_code: {type: string}

    # ------------------------------------------------------------ parties

    Party:
      type: object
      description: 'A group that joins queues together (api.md Parties, Party object).'
      required: [id, leader, members, invites, max_size, ticket]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        leader:
          $ref: '#/components/schemas/Id'
          description: 'User id of the leader.'
        members:
          type: array
          items: {$ref: '#/components/schemas/PartyMember'}
        invites:
          type: array
          description: 'Pending outgoing invitations.'
          items: {$ref: '#/components/schemas/PartyOutgoingInvite'}
        max_size: {type: integer, minimum: 1}
        ticket:
          description: 'The current queue ticket of the party.'
          oneOf: [{$ref: '#/components/schemas/Ticket'}, {type: 'null'}]
    PartyMember:
      type: object
      required: [user, joined_at]
      properties:
        user: {$ref: '#/components/schemas/User'}
        joined_at: {type: string, format: date-time}
    PartyOutgoingInvite:
      type: object
      required: [user, expires_at]
      properties:
        user: {$ref: '#/components/schemas/User'}
        expires_at: {type: string, format: date-time}
    PartyInvite:
      type: object
      description: 'An incoming party invitation.'
      required: [party_id, from, expires_at]
      properties:
        party_id: {$ref: '#/components/schemas/Id'}
        from: {$ref: '#/components/schemas/User'}
        expires_at: {type: string, format: date-time}
    PartyInviteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PartyInvite'}
    CurrentParty:
      type: object
      required: [party]
      properties:
        party:
          oneOf: [{$ref: '#/components/schemas/Party'}, {type: 'null'}]
    UserIdBody:
      type: object
      required: [user_id]
      properties:
        user_id: {$ref: '#/components/schemas/Id'}

    # ------------------------------------------------------------ rooms

    RoomOptions:
      type: object
      description: 'Values of the room options by key; any key other than the reserved ones is the server''s own (api.md Private rooms).'
      properties:
        teams: {$ref: '#/components/schemas/TeamSizes'}
        mode: {$ref: '#/components/schemas/GameIdentifier'}
        stage:
          type: [string, 'null']
          description: 'A stage id, or `null` for the choice of the game.'
        password:
          type: [string, 'null']
          description: 'Requests only, never returned; `null` in PATCH removes it.'
    Room:
      type: object
      description: 'A private room (api.md Private rooms, Room object).'
      required: [id, code, owner, options, has_password, state, members, match_id, created_at, closes_at]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        code:
          type: string
          description: 'What players type to join; case-insensitive.'
        owner:
          $ref: '#/components/schemas/Id'
          description: 'User id of the owner.'
        options: {$ref: '#/components/schemas/RoomOptions'}
        has_password: {type: boolean}
        state:
          type: string
          description: 'Open; an unknown state is treated as `in_match`.'
          examples: [open, in_match, closed]
        members:
          type: array
          items: {$ref: '#/components/schemas/RoomMember'}
        match_id:
          $ref: '#/components/schemas/NullableId'
          description: 'The running match while `in_match`.'
        created_at: {type: string, format: date-time}
        closes_at: {type: string, format: date-time}
    RoomMember:
      type: object
      required: [user, team, ready, joined_at]
      properties:
        user: {$ref: '#/components/schemas/User'}
        team:
          type: string
          description: '`alpha` or `bravo`; 1.1.7 `spectator`: a member in the stands (a launcher that does not know it shows the member in no team).'
          examples: [alpha, bravo, spectator]
        ready: {type: boolean}
        joined_at: {type: string, format: date-time}
    RoomInvite:
      type: object
      description: 'An incoming room invitation (api.md Account, GET /v1/state; events.md `room.invite`).'
      required: [room_id, code, from, expires_at]
      properties:
        room_id: {$ref: '#/components/schemas/Id'}
        code: {type: string}
        from: {$ref: '#/components/schemas/User'}
        expires_at: {type: string, format: date-time}
    CurrentRoom:
      type: object
      required: [room]
      properties:
        room:
          oneOf: [{$ref: '#/components/schemas/Room'}, {type: 'null'}]
    RoomCreate:
      type: object
      required: [options]
      properties:
        options: {$ref: '#/components/schemas/RoomOptions'}
    RoomUpdate:
      type: object
      required: [options]
      properties:
        options:
          $ref: '#/components/schemas/RoomOptions'
          description: 'Only the keys to change.'
    RoomJoin:
      type: object
      required: [code]
      properties:
        code: {type: string}
        password: {type: string}
        seat:
          type: string
          description: '1.1.7, optional: `spectator` to join in the stands; without it a team, or `room_full`.'
          examples: [spectator, player]
    TeamChange:
      type: object
      required: [team]
      properties:
        team:
          type: string
          description: '`alpha`, `bravo`, 1.1.7 `spectator` (into the stands).'
          examples: [alpha, bravo, spectator]
    ReadyChange:
      type: object
      required: [ready]
      properties:
        ready: {type: boolean}

    # ------------------------------------------------------------ queues

    Queue:
      type: object
      description: 'A server-defined queue, evaluated for the caller (api.md Queues, Queue object).'
      required: [id, name, description, order, teams, min_teams, rated, ladder, party, selection, pool, rotation, result_policy, availability, estimated_wait_s, searching, requirements, eligible]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {$ref: '#/components/schemas/LocalizedText'}
        description: {$ref: '#/components/schemas/LocalizedText'}
        order:
          type: integer
          description: 'Lower first.'
        teams: {$ref: '#/components/schemas/TeamSizes'}
        min_teams: {$ref: '#/components/schemas/TeamSizes'}
        rated: {type: boolean}
        ladder: {$ref: '#/components/schemas/NullableId'}
        party:
          type: object
          description: 'Accepted party sizes; solo players are parties of 1.'
          required: [min, max]
          properties:
            min: {type: integer, minimum: 1}
            max: {type: integer, minimum: 1}
        selection:
          type: string
          description: 'How mode and stage are picked; open, an unknown value is shown as chosen by the server (`vote` is reserved).'
          examples: [random, rotation, fixed, vote, game]
        pool:
          type: array
          items: {$ref: '#/components/schemas/PoolEntry'}
        rotation:
          type: [array, 'null']
          description: 'Current and next entries of a schedule.'
          items: {$ref: '#/components/schemas/RotationEntry'}
        result_policy:
          type: string
          description: 'Id of a result policy.'
        availability:
          type: object
          required: [open, windows]
          properties:
            open: {type: boolean}
            windows:
              type: array
              description: 'Upcoming opening windows; empty when always open.'
              items: {$ref: '#/components/schemas/TimeWindow'}
            season: {$ref: '#/components/schemas/Id'}
        estimated_wait_s: {type: [number, 'null'], minimum: 0}
        searching:
          type: [integer, 'null']
          minimum: 0
          description: 'Players searching, or `null` when the server does not tell.'
        requirements:
          type: array
          items: {$ref: '#/components/schemas/Requirement'}
        eligible:
          type: boolean
          description: 'The caller may join now.'
        draft:
          description: '1.1.6, area `draft`: the draft of the queue matches, or `null`.'
          oneOf: [{$ref: '#/components/schemas/DraftDeclaration'}, {type: 'null'}]
    PoolEntry:
      type: object
      required: [mode, stage]
      properties:
        mode: {$ref: '#/components/schemas/GameIdentifier'}
        stage:
          type: [string, 'null']
          description: '`null` = the choice of the game.'
    RotationEntry:
      type: object
      required: [starts_at, ends_at, pool]
      properties:
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        pool:
          type: array
          items: {$ref: '#/components/schemas/PoolEntry'}
    TimeWindow:
      type: object
      required: [starts_at, ends_at]
      properties:
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
    Requirement:
      type: object
      description: 'An entry condition evaluated for the caller, shown as a checklist.'
      required: [id, label, met]
      properties:
        id: {type: string}
        label: {$ref: '#/components/schemas/LocalizedText'}
        met: {type: boolean}
    QueueList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Queue'}
    Ticket:
      type: object
      description: 'A queue ticket (api.md Queues, Endpoints).'
      required: [id, queue_id, party_id, members, created_at, state, match_id, estimated_wait_s]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        queue_id: {$ref: '#/components/schemas/Id'}
        party_id: {$ref: '#/components/schemas/NullableId'}
        members:
          type: array
          items: {$ref: '#/components/schemas/User'}
        created_at: {type: string, format: date-time}
        state:
          type: string
          description: 'Open; `match_found` sets `match_id`.'
          examples: [searching, match_found]
        match_id: {$ref: '#/components/schemas/NullableId'}
        estimated_wait_s: {type: [number, 'null'], minimum: 0}
    CurrentTicket:
      type: object
      required: [ticket]
      properties:
        ticket:
          oneOf: [{$ref: '#/components/schemas/Ticket'}, {type: 'null'}]

    # ------------------------------------------------------------ matches

    Match:
      type: object
      description: 'The match object; non-participants get the public view of an ended match, with only `user` and `team` per participant and no `outcome.players` (api.md Matches, Match object).'
      required: [id, state, origin, rules, participants]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        state:
          type: string
          description: 'See api.md Matches, Lifecycle; open, an unknown state is treated as `running`; 1.1 `under_review` waits for a referee with `outcome` `null` (operators.md section 3).'
          examples: [pending_accept, drafting, ready, running, completed, void, cancelled, under_review]
        origin: {$ref: '#/components/schemas/MatchOrigin'}
        series:
          description: '1.1: present on the games of a series (series.md section 1).'
          oneOf: [{$ref: '#/components/schemas/MatchSeriesRef'}, {type: 'null'}]
        rules: {$ref: '#/components/schemas/MatchRules'}
        participants:
          type: array
          description: 'Every player, in a fixed order.'
          items: {$ref: '#/components/schemas/Participant'}
        you: {$ref: '#/components/schemas/MatchYou'}
        game: {$ref: '#/components/schemas/MatchGame'}
        deadlines: {$ref: '#/components/schemas/Deadlines'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        ended_at: {type: [string, 'null'], format: date-time}
        cancel_reason:
          type: [string, 'null']
          description: '`null`, or why a `cancelled` match was cancelled; open, an unknown value shows nothing.'
          examples: [declined, accept_timeout, room_closed, admin, left]
        outcome:
          description: '`null` until the match ends `completed` or `void`.'
          oneOf: [{$ref: '#/components/schemas/Outcome'}, {type: 'null'}]
        draft:
          $ref: '#/components/schemas/Draft'
          description: '1.1.6, optional: the stage (and mode) draft of the match; in the public view without `you` and votes (draft.md section 3).'
        spectators:
          type: array
          description: '1.1.7, participants only: every spectator of the match, shown to every player; never in `participants` (spectators.md section 4).'
          items: {$ref: '#/components/schemas/Spectator'}
    Spectator:
      type: object
      required: [user, member_name, role, referee, launched, left, reported]
      properties:
        user: {$ref: '#/components/schemas/User'}
        member_name: {$ref: '#/components/schemas/MemberName'}
        role:
          type: string
          examples: [join, host]
        referee: {type: boolean}
        launched: {type: boolean}
        left: {type: boolean}
        status:
          oneOf: [{$ref: '#/components/schemas/ParticipantStatus'}, {type: 'null'}]
        reported: {type: boolean}
    Watchable:
      type: object
      description: '1.1.7: a match or series the caller may watch (spectators.md section 3.2).'
      required: [kind, origin, state, rules, teams, places, can_take]
      properties:
        kind:
          type: string
          examples: [match, series]
        match_id: {$ref: '#/components/schemas/NullableId'}
        series_id: {$ref: '#/components/schemas/NullableId'}
        origin: {$ref: '#/components/schemas/MatchOrigin'}
        state: {type: string}
        rules:
          type: object
          properties:
            mode: {type: string}
            stage: {type: [string, 'null']}
            teams: {type: array, items: {type: integer}}
        teams:
          type: object
          properties:
            alpha: {type: array, items: {$ref: '#/components/schemas/User'}}
            bravo: {type: array, items: {$ref: '#/components/schemas/User'}}
        places:
          type: object
          properties:
            seats: {type: integer, minimum: 1, maximum: 2}
            taken: {type: integer, minimum: 0}
            who: {type: string, examples: [anyone, friends, referees]}
            label: {$ref: '#/components/schemas/LocalizedText'}
        series: {type: [object, 'null']}
        draft: {type: boolean}
        can_take: {type: boolean}
        why:
          type: [string, 'null']
          examples: [spectators_full, incompatible_game]
        missing:
          type: array
          description: 'What the caller own game lacks to watch.'
          items: {type: string}
    # ------------------------------------------------------------ 1.1.6: draft

    DraftDeclaration:
      type: object
      description: '1.1.6: a draft as a queue (`draft`) or a room form value (option `draft`) declares it (draft.md section 2).'
      required: [id, label]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        label: {$ref: '#/components/schemas/LocalizedText'}
        summary: {$ref: '#/components/schemas/LocalizedText'}
        required:
          type: boolean
          description: 'Only launchers declaring `launcher.draft` may play.'
        turn_s: {type: integer, minimum: 1}
        pool:
          type: object
          description: 'The operator fixed pool; empty lists: the pool comes from the origin or the players games.'
          properties:
            stages:
              type: array
              items: {$ref: '#/components/schemas/GameIdentifier'}
            modes:
              type: array
              items: {$ref: '#/components/schemas/GameIdentifier'}
    DraftAction:
      type: object
      description: '1.1.6: one player action (draft.md section 4).'
      required: [turn, choices]
      properties:
        turn:
          type: integer
          minimum: 0
          description: 'The index of the turn acted on (the current one).'
        choices:
          type: array
          maxItems: 16
          description: 'Exactly the turn `count` distinct ids of available options of its `kind`.'
          items: {$ref: '#/components/schemas/GameIdentifier'}
    Draft:
      type: object
      description: '1.1.6: the draft object (draft.md section 3).'
      required: [version, state, title, decider, options, turns, current, teams, result]
      properties:
        version: {type: integer, examples: [1]}
        state:
          type: string
          description: 'Open; unknown: `running`.'
          examples: [waiting, running, done, cancelled]
        preset: {type: string}
        title: {$ref: '#/components/schemas/LocalizedText'}
        summary: {$ref: '#/components/schemas/LocalizedText'}
        decider:
          type: string
          description: 'Informative; `you.can_act` says who may act.'
          examples: [captain, vote, any]
        tiebreak:
          type: string
          examples: [captain, random]
        turn_s: {type: integer, minimum: 1}
        first:
          oneOf: [{$ref: '#/components/schemas/Team'}, {type: 'null'}]
        options:
          type: array
          items: {$ref: '#/components/schemas/DraftOption'}
        turns:
          type: array
          items: {$ref: '#/components/schemas/DraftTurn'}
        current: {type: [integer, 'null'], minimum: 0}
        teams:
          type: object
          required: [alpha, bravo]
          properties:
            alpha: {$ref: '#/components/schemas/DraftTeam'}
            bravo: {$ref: '#/components/schemas/DraftTeam'}
        you:
          type: object
          description: 'Participants only.'
          required: [team, role, can_act, choice]
          properties:
            team: {$ref: '#/components/schemas/Team'}
            role:
              type: string
              examples: [captain, voter, any, none]
            can_act: {type: boolean}
            choice:
              type: [array, 'null']
              items: {$ref: '#/components/schemas/GameIdentifier'}
        result:
          type: object
          required: [mode, stage, stages]
          properties:
            mode: {type: [string, 'null']}
            stage: {type: [string, 'null']}
            stages:
              type: array
              items: {$ref: '#/components/schemas/GameIdentifier'}
    DraftOption:
      type: object
      required: [id, kind, state, by, turn, order, reason]
      properties:
        id: {$ref: '#/components/schemas/GameIdentifier'}
        kind:
          type: string
          examples: [stage, mode]
        state:
          type: string
          description: 'Open; unknown: `unavailable`.'
          examples: [available, banned, picked, unavailable]
        by:
          oneOf: [{$ref: '#/components/schemas/Team'}, {type: 'null'}]
        turn: {type: [integer, 'null'], minimum: 0}
        order: {type: [integer, 'null'], minimum: 1}
        reason:
          type: [string, 'null']
          examples: [game, played, combination]
    DraftTurn:
      type: object
      required: [index, action, kind, teams, count, state, deadline, choices, acted]
      properties:
        index: {type: integer, minimum: 0}
        action:
          type: string
          description: 'Open; unknown: shown as text.'
          examples: [ban, pick, random, last]
        kind:
          type: string
          examples: [stage, mode]
        teams:
          type: array
          items: {$ref: '#/components/schemas/Team'}
        count: {type: integer, minimum: 0}
        state:
          type: string
          examples: [pending, current, done, skipped]
        started_at: {type: [string, 'null'], format: date-time}
        deadline: {type: [string, 'null'], format: date-time}
        ended_at: {type: [string, 'null'], format: date-time}
        choices:
          type: array
          items:
            type: object
            required: [team, ids, by]
            properties:
              team:
                oneOf: [{$ref: '#/components/schemas/Team'}, {type: 'null'}]
              ids:
                type: array
                items: {$ref: '#/components/schemas/GameIdentifier'}
              by:
                type: string
                examples: [players, vote, timeout, server]
        acted:
          type: array
          description: 'Teams that chose in the current turn (their choice stays hidden until it ends).'
          items: {$ref: '#/components/schemas/Team'}
    DraftTeam:
      type: object
      required: [players, actors, captain, auto]
      properties:
        players:
          type: array
          items: {$ref: '#/components/schemas/Id'}
        actors:
          type: array
          items: {$ref: '#/components/schemas/Id'}
        captain: {$ref: '#/components/schemas/NullableId'}
        auto:
          type: boolean
          description: 'No launcher of the team can draft: the server plays its turns.'
        votes:
          type: array
          description: 'The caller own team only, with `decider: vote`.'
          items:
            type: object
            required: [user_id, ids]
            properties:
              user_id: {$ref: '#/components/schemas/Id'}
              ids:
                type: array
                items: {$ref: '#/components/schemas/GameIdentifier'}

    MatchOrigin:
      type: object
      description: 'Where the match comes from; open, an unknown kind shows nothing.'
      required: [kind]
      properties:
        kind:
          type: string
          examples: [room, queue, activity]
        room_id: {$ref: '#/components/schemas/Id'}
        queue_id: {$ref: '#/components/schemas/Id'}
        activity_id:
          $ref: '#/components/schemas/Id'
          description: '1.1, with kind `activity`.'
    MatchSeriesRef:
      type: object
      description: '1.1: the series a match belongs to and its place in it (series.md section 1).'
      required: [id, index, format]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        index: {type: integer, minimum: 1}
        format: {$ref: '#/components/schemas/SeriesFormat'}
    MatchRules:
      type: object
      description: 'Authoritative rules of the match (api.md Matches, Match object).'
      required: [teams, mode, stage, options, rated, ladder, season, result_policy]
      properties:
        teams: {$ref: '#/components/schemas/TeamSizes'}
        mode: {$ref: '#/components/schemas/GameIdentifier'}
        stage:
          type: [string, 'null']
          description: '`null` = the choice of the game.'
        options:
          type: object
          description: 'The other options of the server, echoed.'
        rated: {type: boolean}
        ladder: {$ref: '#/components/schemas/NullableId'}
        season: {$ref: '#/components/schemas/NullableId'}
        result_policy:
          type: string
          description: 'Id of a result policy.'
        loadout:
          $ref: '#/components/schemas/Loadout'
          description: '1.1, optional: weapon and gear constraints the launcher applies (match-contract-2.md section 5).'
    Loadout:
      type: object
      description: '1.1: loadout constraints; `players` (by member name) take precedence over `teams` over `all`; honor-based, not verifiable (match-contract-2.md section 5).'
      properties:
        all: {$ref: '#/components/schemas/LoadoutConstraints'}
        teams:
          type: object
          description: 'Team name to constraints.'
          additionalProperties: {$ref: '#/components/schemas/LoadoutConstraints'}
        players:
          type: object
          description: 'Member name to constraints.'
          additionalProperties: {$ref: '#/components/schemas/LoadoutConstraints'}
        summary: {$ref: '#/components/schemas/LocalizedText'}
      examples:
        - all: {weapon: {allowed: ['<weapon id>', '<weapon id>']}}
          teams: {bravo: {weapon: {fixed: '<weapon id>'}}}
          players: {Ana: {gear: {head: {fixed: '<gear id>'}}}}
          summary: {en: 'Bravo plays one fixed weapon; everyone else picks among two.'}
    LoadoutConstraints:
      type: object
      description: 'Constraints by slot: `weapon`, `gear.head`, `gear.clothes`, `gear.shoes`.'
      properties:
        weapon: {$ref: '#/components/schemas/ItemConstraint'}
        gear:
          type: object
          properties:
            head: {$ref: '#/components/schemas/ItemConstraint'}
            clothes: {$ref: '#/components/schemas/ItemConstraint'}
            shoes: {$ref: '#/components/schemas/ItemConstraint'}
    ItemConstraint:
      type: object
      description: 'Constraint kinds: `fixed` (one id), `allowed` (a list), `denied` (a list).'
      properties:
        fixed: {$ref: '#/components/schemas/GameItemId'}
        allowed:
          type: array
          items: {$ref: '#/components/schemas/GameItemId'}
        denied:
          type: array
          items: {$ref: '#/components/schemas/GameItemId'}
    GameItemId:
      type: [string, number]
      description: 'A weapon or gear id: an opaque string or number from the game data of the player.'
      examples: ['<weapon id>', '<gear id>']
    LaunchReport:
      type: object
      description: 'Body of the launch report: `{}` in 1.0; 1.1 adds the loadout the launcher applied, informational (match-contract-2.md section 5).'
      properties:
        loadout:
          type: object
          properties:
            weapon: {$ref: '#/components/schemas/GameItemId'}
            gear:
              type: object
              properties:
                head: {$ref: '#/components/schemas/GameItemId'}
                clothes: {$ref: '#/components/schemas/GameItemId'}
                shoes: {$ref: '#/components/schemas/GameItemId'}
    Participant:
      type: object
      description: 'A player of the match; the public view has only `user` and `team`.'
      required: [user, team]
      properties:
        user: {$ref: '#/components/schemas/User'}
        member_name: {$ref: '#/components/schemas/MemberName'}
        team: {$ref: '#/components/schemas/Team'}
        role:
          type: string
          description: '`host` creates the game session; open.'
          examples: [host, join]
        accept:
          type: string
          description: 'Open; `accepted` for room matches.'
          examples: [pending, accepted, declined]
        launched:
          type: boolean
          description: 'The launcher reported the launch.'
        status:
          description: 'The last mirrored game state, or `null`.'
          oneOf: [{$ref: '#/components/schemas/ParticipantStatus'}, {type: 'null'}]
        reported:
          type: boolean
          description: 'A terminal report (result or error) was received.'
    ParticipantStatus:
      type: object
      required: [state, at]
      properties:
        state:
          type: string
          description: 'The `state` of the last status file.'
          examples: [booting, lobby, creating-room, waiting-for-players, joining, in-room, loading-stage, in-match, results, finished, error, waiting-command]
        at:
          type: string
          format: date-time
          description: 'When it was received.'
    MatchYou:
      type: object
      description: 'The own entry of the caller.'
      required: [user_id, member_name, team, role]
      properties:
        user_id: {$ref: '#/components/schemas/Id'}
        member_name: {$ref: '#/components/schemas/MemberName'}
        team:
          type: string
          description: '`alpha` or `bravo`; 1.1.7 `spectator` for a spectator.'
          examples: [alpha, bravo, spectator]
        seat:
          type: string
          description: '1.1.7: `player` or `spectator`.'
          examples: [player, spectator]
        role:
          type: string
          examples: [host, join]
        free:
          type: boolean
          description: '1.1.10, optional: true when the caller''s report is in and the match no longer holds it (it may search again); absent otherwise.'
    MatchGame:
      type: object
      description: 'Values of the match contract, present to participants from state `ready` on (match-contract.md section 1, match-contract-2.md section 4).'
      required: [contract, match_id, relay, players, rules, host_name, timeouts]
      properties:
        contract: {$ref: '#/components/schemas/ContractRef'}
        match_id:
          type: string
          description: 'Match id of the game: contract 1, 1 to 32 of `A-Z 0-9` equal to `relay.room`; contract 2, 1 to 64 of `A-Z a-z 0-9 - _`, each round its own.'
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        relay:
          type: object
          required: [host, port, room]
          properties:
            host:
              type: string
              description: 'DNS name or IPv4 address.'
            port: {type: integer, minimum: 1, maximum: 65535}
            room:
              type: string
              description: 'Unguessable relay room (relay.md).'
              pattern: '^[A-Z0-9_-]{1,32}$'
        players: {type: integer, minimum: 2, maximum: 8}
        rules:
          type: string
          maxLength: 1024
          description: 'Value of `KLM_MATCH_RULES` (at most 1024 bytes), passed verbatim: to the host in contract 1, to every participant in contract 2.'
          examples: ['players=2,teams=Camille:A,Lou:B,mode=<mode id>']
        host_name: {$ref: '#/components/schemas/MemberName'}
        timeouts:
          type: [string, 'null']
          description: 'Value of `KLM_MATCH_TIMEOUTS`, or `null`.'
        keep_open:
          type: boolean
          description: '1.1, contract 2: the game stays open after the result and waits for a command (`KLM_MATCH_CMD`, no `KLM_MATCH_EXIT`).'
        continue_from:
          type: [string, 'null']
          description: '1.1, contract 2: the previous match of the same game session (a series), with the same participants, host and relay room; a hint, never an obligation (match-contract-2.md section 6).'
        continue_window_s:
          type: integer
          minimum: 1
          maximum: 300
          description: '1.1.1: how long the launcher keeps a kept-open game waiting for its continuation (default 90).'
    Deadlines:
      type: object
      description: 'Deadlines of the match; they MAY move (api.md Matches, Match object).'
      required: [accept, launch, result]
      properties:
        accept:
          type: [string, 'null']
          format: date-time
          description: 'In state `pending_accept`.'
        launch:
          type: [string, 'null']
          format: date-time
          description: 'Every participant must have reported its launch.'
        result:
          type: [string, 'null']
          format: date-time
          description: 'Latest time for results.'
    Outcome:
      type: object
      description: 'How the match ended (api.md Matches, Outcome object).'
      required: [decision, counted, winner, rated, unrated_reason, summary, record, reports, rematch_id]
      properties:
        decision:
          type: string
          description: 'Open; an unknown value: show `summary`.'
          examples: [agreed, majority, single, forfeit, admin, witnessed, aborted, invalid_reports, disagreement, insufficient_reports, no_reports, no_show, loadout_violation, witness_disagreement]
        counted:
          type: boolean
          description: '`true` for `completed`, `false` for `void`.'
        winner:
          type: [string, 'null']
          examples: [alpha, bravo]
        rated: {type: boolean}
        unrated_reason:
          type: [string, 'null']
          description: 'Why a rated match was not rated; open, show `summary`. 1.1.11 `forfeit`: a forfeit under `leave: forfeit_unrated`. 1.1.12 `one_sided`: a team did not confirm the record with a valid result of its own (a silence, an error, or a witness who is not a referee never confirm).'
          examples: [one_sided, no_winner, no_witness, forfeit]
        summary: {$ref: '#/components/schemas/LocalizedText'}
        record:
          description: 'The accepted record; `null` for `void`.'
          oneOf: [{$ref: '#/components/schemas/OutcomeRecord'}, {type: 'null'}]
        reports: {$ref: '#/components/schemas/ReportCounts'}
        players:
          type: array
          description: 'Participants only: the verdict of each participant.'
          items: {$ref: '#/components/schemas/Verdict'}
        rating_changes:
          type: array
          description: 'With area `ratings`.'
          items: {$ref: '#/components/schemas/RatingChange'}
        invalid_reasons:
          type: array
          description: '1.1.2, participants only: why each refused report was refused (`check`: V1..V11 or `format`).'
          items:
            type: object
            properties:
              user_id: {type: [string, 'null']}
              check: {type: string}
              text: {$ref: '#/components/schemas/LocalizedText'}
        spectators:
          type: array
          description: '1.1.7, participants only: each spectator verdict (`agreed`, `dissent`, `reported`, `invalid`, `error`, `silent`, `absent`), whether it counted as a witness (spectators.md section 6).'
          items:
            type: object
            properties:
              user_id: {type: [string, 'null']}
              referee: {type: boolean}
              counted: {type: boolean}
              verdict: {type: string}
              text: {$ref: '#/components/schemas/LocalizedText'}
        witnessed:
          type: boolean
          description: '1.1.7: witnesses decided the result (a broken disagreement or a required witness found).'
        stats_check:
          type: object
          description: '1.1.8, with a `record`: what the policy `stats` made of the counters of the reports that agree on the outcome, and whose report is the record (api.md Result decision, step 2). Informative: the result stands either way.'
          properties:
            check:
              type: string
              examples: [flag, ignore, strict]
            differ:
              type: boolean
              description: 'A counter or weapon differs between the agreeing reports, by any amount.'
            flagged:
              type: boolean
              description: '`stats: flag`: a gap beyond the tolerance (logged for the operator; `summary` says it).'
            gaps:
              type: array
              maxItems: 16
              items:
                type: object
                properties:
                  field:
                    type: string
                    examples: [turf_permille, paint_points, paint, kills, assists, deaths, specials, weapon]
                  team: {type: string, examples: [alpha, bravo]}
                  user_id: {type: [string, 'null']}
                  values:
                    type: array
                    minItems: 2
                    maxItems: 2
                    description: 'The smallest and the largest value reported (two different ids for a weapon).'
            record_from:
              type: [object, 'null']
              description: 'Whose report is the record (its player lines are the statistics recorded).'
              properties:
                user_id: {type: [string, 'null']}
        forfeit:
          type: object
          description: '1.1.11, with decision `forfeit`: why a team lost by forfeit. A launcher that does not know it shows `summary`; the winner and `counted` are those of any result (api.md Result decision, step 3b and step 7).'
          required: [reason, team, players]
          properties:
            reason:
              type: string
              description: 'Open: `left` (a player of the team left the match in play: its own launcher reported it; policy `leave`), `disconnected` (the record shows a player of the team disconnected; `disconnect: forfeit`), `loadout` (a player broke the match loadout; `loadout_check: forfeit`).'
              examples: [left, disconnected, loadout]
            team:
              type: string
              description: 'The team that lost.'
              examples: [alpha, bravo]
            players:
              type: array
              description: 'The players who left, disconnected or broke the loadout (`user_id` null for an erased account).'
              items:
                type: object
                properties:
                  user_id: {type: [string, 'null']}
        rematch_id:
          $ref: '#/components/schemas/NullableId'
          description: 'The match created by a `rematch` policy.'
    OutcomeRecord:
      type: object
      description: 'The accepted record: the shared fields of the result file under their own names, plus `end_utc`, the `alpha` and `bravo` teams only, and `user_id` on each player (api.md Matches, Outcome object). 1.1.8: one agreeing report as written, the one closest to the others (`stats_check.record_from`).'
      required: [rule, mode, stage_id, stage_scene, battle_frames, duration_s, win_team, winner, deemed_result, end_utc, teams, players]
      properties:
        rule: {type: integer}
        mode: {$ref: '#/components/schemas/GameIdentifier'}
        stage_id: {type: integer}
        stage_scene: {$ref: '#/components/schemas/GameIdentifier'}
        battle_frames: {type: integer, minimum: 1, maximum: 216000, description: '1.1.2: informative, not compared between reports.'}
        duration_s: {type: number, minimum: 0}
        win_team:
          type: integer
          minimum: -1
          maximum: 1
          description: '0 alpha, 1 bravo, -1 none.'
        winner:
          type: string
          examples: [alpha, bravo, none]
        deemed_result: {type: integer}
        end_utc:
          type: [integer, "null"]
          description: 'From one agreeing report, informative; null when none carries an integer.'
        teams:
          type: array
          description: 'The `alpha` and `bravo` teams only.'
          items: {$ref: '#/components/schemas/RecordTeam'}
        players:
          type: array
          items: {$ref: '#/components/schemas/RecordPlayer'}
    RecordTeam:
      type: object
      required: [team, paint_points, turf_permille]
      properties:
        team: {$ref: '#/components/schemas/Team'}
        paint_points: {type: integer, minimum: 0, maximum: 999999}
        turf_permille: {type: integer, minimum: 0, maximum: 1000}
    RecordPlayer:
      type: object
      required: [user_id, name, team, paint, kills, assists, deaths, specials, disconnected]
      properties:
        user_id:
          $ref: '#/components/schemas/NullableId'
          description: '`null` for an erased account.'
        name: {type: string}
        team: {$ref: '#/components/schemas/Team'}
        paint: {type: integer}
        kills: {type: integer}
        assists: {type: integer}
        deaths: {type: integer}
        specials: {type: integer}
        disconnected: {type: boolean}
    ReportCounts:
      type: object
      required: [expected, results, agreeing, errors, invalid]
      properties:
        expected: {type: integer, minimum: 0}
        results: {type: integer, minimum: 0}
        agreeing: {type: integer, minimum: 0}
        errors: {type: integer, minimum: 0}
        invalid: {type: integer, minimum: 0}
    Verdict:
      type: object
      description: 'What the decision made of the report of one participant.'
      required: [user_id, verdict]
      properties:
        user_id: {$ref: '#/components/schemas/Id'}
        verdict:
          type: string
          description: 'Open.'
          examples: [agreed, dissent, invalid, error, silent, no_show]
    CurrentMatch:
      type: object
      required: [match]
      properties:
        match:
          oneOf: [{$ref: '#/components/schemas/Match'}, {type: 'null'}]
    ResultReceipt:
      type: object
      description: 'Answer to a result upload (api.md Matches, Endpoints).'
      required: [match, report]
      properties:
        match: {$ref: '#/components/schemas/Match'}
        report:
          type: object
          required: [accepted, verdict]
          properties:
            accepted: {type: boolean}
            verdict:
              type: [string, 'null']
              description: 'The verdict string of the uploader (as in `outcome.players`); `null` until the decision.'
              examples: [agreed, dissent, invalid, error, silent, no_show]

    # ------------------------------------------------------------ game files (match-contract.md)

    StatusFile:
      type: object
      description: 'The status file of the game, sent verbatim; only an object without a string `state` is refused (match-contract.md section 4, Status mirror).'
      required: [state]
      properties:
        version: {type: integer, examples: [1]}
        match_id: {type: string}
        role:
          type: string
          examples: [host, join]
        state:
          type: string
          description: 'Open; `in-match` is evidence that the participant played; 1.1 `waiting-command` is between rounds (contract 2).'
          examples: [booting, lobby, creating-room, waiting-for-players, joining, in-room, loading-stage, in-match, results, finished, error, waiting-command]
        since_unix: {type: number}
        detail: {type: string}
        present:
          type: integer
          minimum: 0
          description: 'Host, `waiting-for-players`: players present.'
        expected:
          type: integer
          minimum: 0
          description: 'Host, `waiting-for-players`: players expected.'
        visible: {type: boolean}
        pid: {type: integer}
        error:
          type: string
          description: 'State `error` only.'
        reason:
          type: string
          description: 'State `error` only.'
    ResultUpload:
      type: object
      description: 'Body of a result upload: the result file verbatim or a launcher error report; any other object is recorded as an invalid report, not refused (api.md Matches, Result upload).'
      anyOf:
        - $ref: '#/components/schemas/ResultFile'
        - $ref: '#/components/schemas/LauncherErrorReport'
        - title: Unrecognized report
          type: object
    ResultFile:
      description: 'The result file of the game: a record, a version 1 error, or a version 2 `aborted` file (match-contract.md section 4, match-contract-2.md section 7).'
      oneOf:
        - $ref: '#/components/schemas/ResultRecord'
        - $ref: '#/components/schemas/ResultError'
        - $ref: '#/components/schemas/ResultAborted'
    ResultRecord:
      type: object
      description: 'Result file holding the record of the match, version 1 or 2 (`outcome` `completed`); ranges and `settings_ok` are the checks V1 to V10 of api.md Result decision and match-contract-2.md section 7.'
      required: [version, match_id, role, rule, mode, stage_id, stage_scene, battle_frames, win_team, winner, deemed_result, teams, players]
      allOf:
        - not:
            required: [error]
        - not:
            description: 'V10: a host report with `settings_ok: false` is invalid.'
            required: [role, settings_ok]
            properties:
              role: {const: host}
              settings_ok: {const: false}
      if:
        required: [version]
        properties:
          version: {const: 2}
      then:
        required: [outcome, round]
      properties:
        version: {type: integer, minimum: 1, maximum: 2}
        outcome:
          const: completed
          description: 'Version 2: a record has `outcome` `completed`.'
        round:
          type: integer
          minimum: 0
          description: 'Version 2: the round of the game session; not a shared field.'
        requested:
          description: 'Version 2: the settings requested of the room; not a shared field (shape not specified by match-contract-2.md).'
        settings_ok:
          type: boolean
          description: 'Version 2: the room took the rules (V10).'
        room:
          description: 'Version 2: the settings the room actually had; not a shared field (shape not specified by match-contract-2.md).'
        rule_name:
          type: string
          description: 'Version 2: not a shared field.'
        match_id:
          type: string
          description: 'Equals `game.match_id`.'
        role:
          type: string
          description: 'Role of the uploader.'
          examples: [host, join]
        rule: {type: integer}
        mode: {$ref: '#/components/schemas/GameIdentifier'}
        stage_id: {type: integer}
        stage_scene: {$ref: '#/components/schemas/GameIdentifier'}
        end_utc:
          type: number
          description: 'Clock of the machine; informative.'
        battle_frames: {type: integer, minimum: 1, maximum: 216000}
        duration_s: {type: number, minimum: 0}
        win_team:
          type: integer
          minimum: -1
          maximum: 1
          description: '0 alpha, 1 bravo, -1 none.'
        winner:
          type: string
          examples: [alpha, bravo, none]
        deemed_result: {type: integer}
        teams:
          type: array
          description: 'Has `alpha` and `bravo`; a `charlie` team with zeros may appear and is ignored.'
          items: {$ref: '#/components/schemas/ResultTeam'}
        players:
          type: array
          description: 'One entry per participant, named by `member_name`.'
          items: {$ref: '#/components/schemas/ResultPlayer'}
        t0_unix: {type: number}
        timeline_s: {$ref: '#/components/schemas/Timeline'}
    ResultTeam:
      type: object
      required: [team, paint_points, turf_permille]
      properties:
        team:
          type: string
          examples: [alpha, bravo, charlie]
        paint_points: {type: integer, minimum: 0, maximum: 999999}
        turf_permille: {type: integer, minimum: 0, maximum: 1000}
    ResultPlayer:
      type: object
      required: [name, self, team, paint, kills, assists, deaths, specials, disconnected]
      properties:
        name: {type: string}
        self:
          type: boolean
          description: 'Exactly one player, the uploader.'
        team: {$ref: '#/components/schemas/Team'}
        paint: {type: integer, minimum: 0, maximum: 999999}
        kills: {type: integer, minimum: 0, maximum: 9999}
        assists: {type: integer, minimum: 0, maximum: 9999}
        deaths: {type: integer, minimum: 0, maximum: 9999}
        specials: {type: integer, minimum: 0, maximum: 9999}
        disconnected: {type: boolean}
    ResultError:
      type: object
      description: 'Result file holding a game error instead of a record (match-contract.md section 4).'
      required: [version, match_id, role, error]
      properties:
        version: {type: integer, examples: [1]}
        match_id: {type: string}
        role:
          type: string
          examples: [host, join]
        error:
          type: string
          minLength: 1
          maxLength: 64
          description: 'Game error code; open.'
          examples: [bad-settings, boot-timeout, network-unavailable, list-timeout, create-failed, players-timeout, room-not-found, join-failed, host-left, player-left, start-timeout, stage-timeout, left-by-player, match-aborted, record-timeout]
        reason: {type: string}
        t0_unix: {type: number}
        timeline_s: {$ref: '#/components/schemas/Timeline'}
    ResultAborted:
      type: object
      description: '1.1: a version 2 result file without record; uploaded as is and treated as the error `match-aborted` (match-contract-2.md section 7).'
      required: [version, outcome]
      not:
        required: [error]
      properties:
        version: {type: integer, const: 2}
        outcome: {const: aborted}
        match_id: {type: string}
        role:
          type: string
          examples: [host, join]
        round: {type: integer, minimum: 0}
    LauncherErrorReport:
      type: object
      description: 'Uploaded instead of a result file when the game wrote none; in version 2 `error` is the error code of the status file (match-contract.md section 4, match-contract-2.md section 7).'
      required: [version, match_id, error, reason]
      properties:
        version: {type: integer, minimum: 1, maximum: 2}
        match_id:
          type: string
          description: 'The `game.match_id`.'
        error:
          type: string
          minLength: 1
          maxLength: 64
          description: 'Launcher error code, or (version 2) the status file error code; open.'
          examples: [launcher-failed, launcher-crashed, launcher-cancelled, launcher-relay-unresolved, launcher-unsupported-rules, launcher-loadout-unavailable, launcher-incompatible, left-by-player, connection-lost]
        reason: {type: string}
        in_play:
          type: boolean
          description: '1.1.11, with `left-by-player`: the status file''s `in_play`, copied: `true` when the player left the match while it was being played (the game heard every other player until then), `false` when it left before the match or with other players already gone. Absent from a launcher or a game older than 1.1.11. Only `true` can make the leaver''s team lose (policy `leave`).'
    Timeline:
      type: array
      description: 'Steps of the game as `[label, seconds]` pairs; informative.'
      items:
        type: array
        prefixItems:
          - {type: string}
          - {type: number}

    # ------------------------------------------------------------ ratings and leaderboards

    Ladder:
      type: object
      description: 'A group of rated queues (api.md Ratings, Ladder object).'
      required: [id, name, description, queues, season, leaderboard]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {$ref: '#/components/schemas/LocalizedText'}
        description: {$ref: '#/components/schemas/LocalizedText'}
        queues:
          type: array
          items: {$ref: '#/components/schemas/Id'}
        season:
          description: 'The current season, or `null` (no seasons).'
          oneOf: [{$ref: '#/components/schemas/Season'}, {type: 'null'}]
        tiers:
          type: array
          description: 'Tier labels the ladder uses, `order` ascending from lowest.'
          items: {$ref: '#/components/schemas/Tier'}
        leaderboard: {type: boolean}
        group:
          $ref: '#/components/schemas/LocalizedText'
          description: '1.1, optional: groups ladders in lists, for example by mode or season (presentation.md section 3).'
        primary:
          type: boolean
          description: '1.1, optional: the ladder to show next to a name.'
    LadderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Ladder'}
    Season:
      type: object
      required: [id, name, starts_at, ends_at]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {$ref: '#/components/schemas/LocalizedText'}
        starts_at: {type: string, format: date-time}
        ends_at: {type: [string, 'null'], format: date-time}
        current:
          type: boolean
          description: 'In GET /v1/seasons.'
    SeasonList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 'Newest first.'
          items: {$ref: '#/components/schemas/Season'}
    Tier:
      type: object
      required: [id, name, color, order]
      properties:
        id: {type: string}
        name: {$ref: '#/components/schemas/LocalizedText'}
        color:
          type: string
          description: 'A hint, `#RRGGBB`.'
          pattern: '^#[0-9A-Fa-f]{6}$'
        order: {type: integer}
    RatingView:
      type: object
      description: 'A rating as presentable data; every member but `ladder` is optional or null (api.md Ratings, Rating view).'
      required: [ladder]
      properties:
        ladder: {$ref: '#/components/schemas/Id'}
        season: {$ref: '#/components/schemas/NullableId'}
        value: {type: [number, 'null']}
        display:
          type: [string, 'null']
          description: 'How to show the rating; preferred over `value`.'
        tier:
          oneOf: [{$ref: '#/components/schemas/Tier'}, {type: 'null'}]
        progress:
          type: [object, 'null']
          description: 'A progress bar.'
          required: [value, max, label]
          properties:
            value: {type: number}
            max: {type: number}
            label: {$ref: '#/components/schemas/LocalizedText'}
        provisional:
          type: [object, 'null']
          description: 'Placement: matches remaining before the rating is shown.'
          required: [remaining, label]
          properties:
            remaining: {type: integer, minimum: 0}
            label:
              oneOf: [{$ref: '#/components/schemas/LocalizedText'}, {type: 'null'}]
        last_change:
          type: [object, 'null']
          required: [delta, match_id, at, reason]
          properties:
            delta: {type: number}
            match_id: {$ref: '#/components/schemas/NullableId'}
            at: {type: string, format: date-time}
            reason: {$ref: '#/components/schemas/LocalizedText'}
        fields:
          type: array
          items: {$ref: '#/components/schemas/DisplayField'}
    RatingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/RatingView'}
    RatingChange:
      type: object
      description: 'A rating change of a match (api.md Ratings, Rating change).'
      required: [user_id, ladder, season, delta, before, after, reason]
      properties:
        user_id: {$ref: '#/components/schemas/Id'}
        ladder: {$ref: '#/components/schemas/Id'}
        season: {$ref: '#/components/schemas/NullableId'}
        delta: {type: number}
        before: {$ref: '#/components/schemas/RatingSnapshot'}
        after: {$ref: '#/components/schemas/RatingSnapshot'}
        reason: {$ref: '#/components/schemas/LocalizedText'}
    RatingSnapshot:
      type: object
      description: 'Presentable rating before or after a change.'
      required: [display, tier]
      properties:
        display: {type: [string, 'null']}
        tier:
          oneOf: [{$ref: '#/components/schemas/Tier'}, {type: 'null'}]
    DisplayField:
      type: object
      description: 'A presentable row: key, label and a string or number value.'
      required: [key, label, value]
      properties:
        key: {type: string}
        label: {$ref: '#/components/schemas/LocalizedText'}
        value: {type: [string, number]}
    Page:
      type: object
      description: 'A page of a paginated list (api.md Pagination).'
      required: [items, next_cursor]
      properties:
        items: {type: array}
        next_cursor:
          type: [string, 'null']
          maxLength: 256
          description: '`null` on the last page.'
    Leaderboard:
      description: 'A page of the leaderboard of a ladder with server-declared columns (api.md Ratings, Leaderboard).'
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [ladder, season, columns, you]
          properties:
            ladder: {$ref: '#/components/schemas/Id'}
            season: {$ref: '#/components/schemas/NullableId'}
            columns:
              type: array
              items: {$ref: '#/components/schemas/LeaderboardColumn'}
            items:
              type: array
              items: {$ref: '#/components/schemas/LeaderboardRow'}
            you:
              description: 'The row of the caller, or `null`.'
              oneOf: [{$ref: '#/components/schemas/LeaderboardRow'}, {type: 'null'}]
    LeaderboardColumn:
      type: object
      required: [key, label, type]
      properties:
        key: {type: string}
        label: {$ref: '#/components/schemas/LocalizedText'}
        type:
          type: string
          description: 'Cell type: `rank` integer, `player` User, `number`, `text` string, `tier` Tier, `percent` 0-100, `delta` signed number; open, unknown: show strings and numbers as text, else blank.'
          examples: [rank, player, number, text, tier, percent, delta]
    LeaderboardRow:
      type: object
      required: [user_id, cells]
      properties:
        user_id: {$ref: '#/components/schemas/Id'}
        cells:
          type: object
          description: 'Column key to cell value, typed by the column.'

    # ------------------------------------------------------------ statistics and history

    Stats:
      type: object
      description: 'Presentable statistics groups chosen by the server (api.md Statistics and history).'
      required: [user_id, groups]
      properties:
        user_id: {$ref: '#/components/schemas/Id'}
        groups:
          type: array
          items: {$ref: '#/components/schemas/StatGroup'}
    StatGroup:
      type: object
      required: [key, label, fields]
      properties:
        key: {type: string}
        label: {$ref: '#/components/schemas/LocalizedText'}
        fields:
          type: array
          items: {$ref: '#/components/schemas/DisplayField'}
    HistoryItem:
      type: object
      description: 'An ended match in the history of a player (api.md Statistics and history).'
      required: [match_id, ended_at, state, origin, rules, team, result, stage, stats, rating_delta]
      properties:
        match_id: {$ref: '#/components/schemas/Id'}
        ended_at: {type: string, format: date-time}
        state:
          type: string
          examples: [completed, void]
        origin: {$ref: '#/components/schemas/MatchOrigin'}
        rules: {$ref: '#/components/schemas/HistoryRules'}
        team: {$ref: '#/components/schemas/Team'}
        result:
          type: string
          description: '`none` for a void match or no winner; open.'
          examples: [win, loss, none]
        stage:
          type: [string, 'null']
          description: 'The stage played.'
        stats:
          type: [object, 'null']
          description: 'The line of the player in the accepted record; `null` when void.'
          required: [paint, kills, assists, deaths, specials, disconnected]
          properties:
            paint: {type: integer}
            kills: {type: integer}
            assists: {type: integer}
            deaths: {type: integer}
            specials: {type: integer}
            disconnected: {type: boolean}
        rating_delta: {type: [number, 'null']}
        forfeit:
          type: object
          description: '1.1.11, optional: present when the match was won or lost by forfeit: the outcome `forfeit` (`reason`, `team`, `players`).'
          properties:
            reason: {type: string, examples: [left, disconnected, loadout]}
            team: {type: string, examples: [alpha, bravo]}
            players:
              type: array
              items:
                type: object
                properties:
                  user_id: {type: [string, 'null']}
    HistoryRules:
      type: object
      description: 'The rules of a history entry: a subset of MatchRules.'
      required: [teams, mode, stage, rated, ladder]
      properties:
        teams: {$ref: '#/components/schemas/TeamSizes'}
        mode: {$ref: '#/components/schemas/GameIdentifier'}
        stage: {type: [string, 'null']}
        rated: {type: boolean}
        ladder: {$ref: '#/components/schemas/NullableId'}
    HistoryPage:
      description: 'A page of match history.'
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/HistoryItem'}

    # ------------------------------------------------------------ moderation

    Report:
      type: object
      description: 'A report about a player (api.md Moderation).'
      required: [user_id, category]
      properties:
        user_id: {$ref: '#/components/schemas/Id'}
        match_id: {$ref: '#/components/schemas/NullableId'}
        category:
          type: string
          description: 'An id of `moderation.report_categories`.'
        comment: {type: string, maxLength: 1000}
    ReportReceipt:
      type: object
      required: [id, created_at]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        created_at: {type: string, format: date-time}
    Block:
      type: object
      required: [user, since]
      properties:
        user: {$ref: '#/components/schemas/User'}
        since: {type: string, format: date-time}
    BlockList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Block'}

    # ------------------------------------------------------------ test clock

    TestClockAdvance:
      type: object
      required: [advance_s]
      properties:
        advance_s:
          type: number
          minimum: 0
          description: 'Seconds to move the server clock forward.'
    TestClockTime:
      type: object
      required: [time]
      properties:
        time: {type: string, format: date-time}

    # ------------------------------------------------------------ 1.1: views (activities.md)

    ViewText:
      type: object
      description: 'Localized text in a view or activity: plain text, at most 2000 characters per entry (activities.md section 6).'
      additionalProperties: {type: string, maxLength: 2000}
    ViewLabel:
      type: object
      description: 'Localized title or label in a view or activity: plain text, at most 120 characters per entry (activities.md section 6).'
      additionalProperties: {type: string, maxLength: 120}
    ViewValue:
      description: 'A shown value: localized text, a string or a number.'
      oneOf:
        - $ref: '#/components/schemas/ViewText'
        - type: [string, number]
          maxLength: 2000
    Icon:
      type: string
      description: 'An icon name drawn by the launcher itself, never an image; open, an unknown name shows no icon (activities.md section 5).'
      examples: [trophy, swords, shield, star, crown, flag, clock, calendar, users, user, target, fire, bolt, medal, ribbon, map, dice, lock, check, info, warning, chat, chart, heart]
    Color:
      type: string
      description: 'A color hint, `#RRGGBB`; the launcher may adapt it for contrast.'
      pattern: '^#[0-9A-Fa-f]{6}$'
    ActivityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ActivitySummary'}
    ActivitySummary:
      type: object
      description: 'An activity as a list entry (activities.md section 2).'
      required: [id, kind, title, subtitle, icon, color, order, state, you, revision]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        kind:
          $ref: '#/components/schemas/ViewLabel'
          description: 'Names the kind, for display only; the launcher never branches on it.'
        title: {$ref: '#/components/schemas/ViewLabel'}
        subtitle: {$ref: '#/components/schemas/ViewText'}
        icon: {$ref: '#/components/schemas/Icon'}
        color: {$ref: '#/components/schemas/Color'}
        order:
          type: integer
          description: 'Lower first.'
        state:
          type: string
          description: 'Open; an unknown state is shown as `running`.'
          examples: [upcoming, open, running, finished, cancelled]
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        participants:
          type: object
          properties:
            count: {type: integer, minimum: 0}
            capacity: {type: integer, minimum: 0}
        join:
          type: object
          description: 'The main participation action, for a join button in lists.'
          required: [action, label]
          properties:
            action:
              type: string
              description: 'An action id of the view.'
            label: {$ref: '#/components/schemas/ViewLabel'}
        you:
          type: object
          required: [joined]
          properties:
            joined:
              type: boolean
              description: 'The caller takes part.'
        revision:
          type: integer
          description: 'Increases at every change of the view of the activity.'
    View:
      type: object
      description: 'A declarative screen of typed data components, never code; also the answer of a profile (activities.md sections 1 and 3, presentation.md section 2).'
      required: [sections]
      properties:
        id: {type: string}
        revision: {type: integer}
        title: {$ref: '#/components/schemas/ViewLabel'}
        state:
          type: string
          examples: [upcoming, open, running, finished, cancelled]
        sections:
          type: array
          description: 'Components shown top to bottom; at most 500 components at all levels.'
          maxItems: 500
          items: {$ref: '#/components/schemas/Component'}
        actions:
          type: array
          description: 'Buttons shown with the view; at most 50 actions in a view.'
          maxItems: 50
          items: {$ref: '#/components/schemas/Action'}
    ActivityView:
      description: 'The current view of an activity for the caller, which may differ per player (activities.md section 2).'
      allOf:
        - $ref: '#/components/schemas/View'
        - type: object
          required: [id, revision, title, state, actions]
    Action:
      type: object
      description: 'A button; with `confirm` the launcher asks first, with `form` it submits that form (activities.md section 3).'
      required: [id, label, style, enabled]
      properties:
        id: {type: string, minLength: 1}
        label: {$ref: '#/components/schemas/ViewLabel'}
        style:
          type: string
          description: 'Open; an unknown style renders as the default.'
          examples: [primary, secondary, danger]
        enabled: {type: boolean}
        disabled_reason: {$ref: '#/components/schemas/ViewText'}
        confirm: {$ref: '#/components/schemas/ViewText'}
        form:
          type: string
          description: 'Id of the form whose values the action submits.'
    ActionRequest:
      type: object
      description: 'Body of an action (activities.md section 2).'
      properties:
        values:
          type: object
          description: 'Form values by field key, only for actions bound to a form.'
        revision:
          type: integer
          description: 'The view revision the player acted on; optional.'
    ActionResult:
      type: object
      description: 'Answer of an action; every member is optional.'
      properties:
        view: {$ref: '#/components/schemas/ActivityView'}
        notice: {$ref: '#/components/schemas/Notice'}
        match_id:
          $ref: '#/components/schemas/NullableId'
          description: 'A match the action created or joined.'
        series_id:
          $ref: '#/components/schemas/NullableId'
          description: 'A series the action created or joined.'
    Notice:
      type: object
      description: 'A transient message.'
      required: [level, text]
      properties:
        level:
          type: string
          description: 'Open; an unknown level renders as `info`.'
          examples: [info, success, warning, error]
        text: {$ref: '#/components/schemas/ViewText'}
    Component:
      description: 'A data component; `type` tells them apart. An unknown type stays valid (GenericComponent): the launcher shows its `fallback`, else skips it (activities.md section 3).'
      anyOf:
        - $ref: '#/components/schemas/TextComponent'
        - $ref: '#/components/schemas/NoticeComponent'
        - $ref: '#/components/schemas/FieldsComponent'
        - $ref: '#/components/schemas/ListComponent'
        - $ref: '#/components/schemas/TableComponent'
        - $ref: '#/components/schemas/CountdownComponent'
        - $ref: '#/components/schemas/ProgressComponent'
        - $ref: '#/components/schemas/BracketComponent'
        - $ref: '#/components/schemas/SeriesComponent'
        - $ref: '#/components/schemas/MatchComponent'
        - $ref: '#/components/schemas/UserComponent'
        - $ref: '#/components/schemas/FormComponent'
        - $ref: '#/components/schemas/ActionsComponent'
        - $ref: '#/components/schemas/LinkComponent'
        - $ref: '#/components/schemas/GroupComponent'
        - $ref: '#/components/schemas/GenericComponent'
    ComponentBase:
      type: object
      description: 'Members any component may carry: `type`, `id` (stable within the view), `fallback` and `x-` members.'
      required: [type]
      properties:
        type: {type: string}
        id: {type: string}
        fallback:
          $ref: '#/components/schemas/ViewText'
          description: 'Shown by launchers that do not know the type.'
    GenericComponent:
      description: 'A component of a type this version does not define (a later version, or an operator `x-` type).'
      allOf:
        - $ref: '#/components/schemas/ComponentBase'
        - type: object
          properties:
            type:
              type: string
              not:
                pattern: '^(text|notice|fields|list|table|countdown|progress|bracket|series|match|user|form|actions|link|group)$'
    TextComponent:
      description: 'A paragraph.'
      allOf:
        - $ref: '#/components/schemas/ComponentBase'
        - type: object
          required: [type, text]
          properties:
            type: {const: text}
            text: {$ref: '#/components/schemas/ViewText'}
            style:
              type: string
              description: 'Open; an unknown style renders as `body`.'
              examples: [body, heading, caption, muted]
    NoticeComponent:
      description: 'A colored box.'
      allOf:
        - $ref: '#/components/schemas/ComponentBase'
        - type: object
          required: [type, level, text]
          properties:
            type: {const: notice}
            level:
              type: string
              description: 'Open; an unknown level renders as `info`.'
              examples: [info, success, warning, error]
            text: {$ref: '#/components/schemas/ViewText'}
    FieldsComponent:
      description: 'A key-value list.'
      allOf:
        - $ref: '#/components/schemas/ComponentBase'
        - type: object
          required: [type, items]
          properties:
            type: {const: fields}
            items:
              type: array
              items:
                type: object
                required: [label, value]
                properties:
                  label: {$ref: '#/components/schemas/ViewLabel'}
                  value: {$ref: '#/components/schemas/ViewValue'}
                  hint: {$ref: '#/components/schemas/ViewText'}
    ListComponent:
      description: 'A list; `trailing` is a short value on the right.'
      allOf:
        - $ref: '#/components/schemas/ComponentBase'
        - type: object
          required: [type, items]
          properties:
            type: {const: list}
            items:
              type: array
              maxItems: 500
              items:
                type: object
                required: [title]
                properties:
                  title: {$ref: '#/components/schemas/ViewLabel'}
                  subtitle: {$ref: '#/components/schemas/ViewText'}
                  trailing: {$ref: '#/components/schemas/ViewValue'}
                  user: {$ref: '#/components/schemas/User'}
                  icon: {$ref: '#/components/schemas/Icon'}
                  action: {$ref: '#/components/schemas/Action'}
            empty:
              $ref: '#/components/schemas/ViewText'
              description: 'Shown when `items` is empty.'
    TableComponent:
      description: 'A table with the column types of leaderboards.'
      allOf:
        - $ref: '#/components/schemas/ComponentBase'
        - type: object
          required: [type, columns, rows]
          properties:
            type: {const: table}
            columns:
              type: array
              items:
                type: object
                required: [key, label, type]
                properties:
                  key: {type: string}
                  label: {$ref: '#/components/schemas/ViewLabel'}
                  type:
                    type: string
                    description: 'Open, as LeaderboardColumn `type`.'
                    examples: [rank, player, number, text, tier, percent, delta]
            rows:
              type: array
              maxItems: 500
              items:
                type: object
                required: [cells]
                properties:
                  cells:
                    type: object
                    description: 'Column key to cell value, typed by the column.'
                  user_id: {$ref: '#/components/schemas/Id'}
                  highlight: {type: boolean}
            caption: {$ref: '#/components/schemas/ViewText'}
    CountdownComponent:
      description: 'A live countdown; the launcher refetches the view at zero.'
      allOf:
        - $ref: '#/components/schemas/ComponentBase'
        - type: object
          required: [type, label, until]
          properties:
            type: {const: countdown}
            label: {$ref: '#/components/schemas/ViewLabel'}
            until: {type: string, format: date-time}
    ProgressComponent:
      description: 'A bar.'
      allOf:
        - $ref: '#/components/schemas/ComponentBase'
        - type: object
          required: [type, label, value, max]
          properties:
            type: {const: progress}
            label: {$ref: '#/components/schemas/ViewLabel'}
            value: {type: number}
            max: {type: number}
    BracketComponent:
      description: 'An elimination tree: match k of the next round is fed by matches 2k and 2k+1 of this round; at most 8 rounds of 128 matches.'
      allOf:
        - $ref: '#/components/schemas/ComponentBase'
        - type: object
          required: [type, rounds]
          properties:
            type: {const: bracket}
            rounds:
              type: array
              maxItems: 8
              items:
                type: object
                required: [title, matches]
                properties:
                  title: {$ref: '#/components/schemas/ViewLabel'}
                  matches:
                    type: array
                    maxItems: 128
                    items: {$ref: '#/components/schemas/BracketMatch'}
    BracketMatch:
      type: object
      required: [id, slots, state]
      properties:
        id: {type: string}
        slots:
          type: array
          items:
            type: object
            required: [label, winner]
            properties:
              label: {$ref: '#/components/schemas/ViewLabel'}
              user: {$ref: '#/components/schemas/User'}
              score: {type: [number, string]}
              winner: {type: boolean}
        state:
          type: string
          description: 'Open.'
        match_id: {$ref: '#/components/schemas/Id'}
        series_id: {$ref: '#/components/schemas/Id'}
    SeriesComponent:
      description: 'The series card (score, games), fetched by id.'
      allOf:
        - $ref: '#/components/schemas/ComponentBase'
        - type: object
          required: [type, series_id]
          properties:
            type: {const: series}
            series_id: {$ref: '#/components/schemas/Id'}
            title: {$ref: '#/components/schemas/ViewLabel'}
    MatchComponent:
      description: 'A match card (the own match view of the launcher).'
      allOf:
        - $ref: '#/components/schemas/ComponentBase'
        - type: object
          required: [type, match_id]
          properties:
            type: {const: match}
            match_id: {$ref: '#/components/schemas/Id'}
            title: {$ref: '#/components/schemas/ViewLabel'}
    UserComponent:
      description: 'A player card.'
      allOf:
        - $ref: '#/components/schemas/ComponentBase'
        - type: object
          required: [type, user]
          properties:
            type: {const: user}
            user: {$ref: '#/components/schemas/User'}
            subtitle: {$ref: '#/components/schemas/ViewText'}
            badges:
              type: array
              items: {$ref: '#/components/schemas/Badge'}
    FormComponent:
      description: 'A form of 1.0 fields; submitting calls `submit` with `values`.'
      allOf:
        - $ref: '#/components/schemas/ComponentBase'
        - type: object
          required: [type, id, fields, submit]
          properties:
            type: {const: form}
            id: {type: string, minLength: 1}
            fields:
              type: array
              items: {$ref: '#/components/schemas/Field'}
            submit: {$ref: '#/components/schemas/Action'}
    ActionsComponent:
      description: 'A row of buttons.'
      allOf:
        - $ref: '#/components/schemas/ComponentBase'
        - type: object
          required: [type, items]
          properties:
            type: {const: actions}
            items:
              type: array
              maxItems: 50
              items: {$ref: '#/components/schemas/Action'}
    LinkComponent:
      description: 'A link showing its host, opened in the system browser on click only.'
      allOf:
        - $ref: '#/components/schemas/ComponentBase'
        - type: object
          required: [type, label, url]
          properties:
            type: {const: link}
            label: {$ref: '#/components/schemas/ViewLabel'}
            url:
              type: string
              format: uri
              pattern: '^https://'
    GroupComponent:
      description: 'A titled group; nesting of groups at most 4 levels.'
      allOf:
        - $ref: '#/components/schemas/ComponentBase'
        - type: object
          required: [type, children]
          properties:
            type: {const: group}
            title: {$ref: '#/components/schemas/ViewLabel'}
            children:
              type: array
              maxItems: 500
              items: {$ref: '#/components/schemas/Component'}
            collapsed: {type: boolean}

    # ------------------------------------------------------------ 1.1: series (series.md)

    Series:
      type: object
      description: 'A chain of matches between the same sides; others than participants get the public view of an ended series (series.md section 1).'
      required: [id, origin, format, state, sides, games, winner, created_at, ended_at]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        origin: {$ref: '#/components/schemas/MatchOrigin'}
        format: {$ref: '#/components/schemas/SeriesFormat'}
        state:
          type: string
          description: 'Open; an unknown state is treated as `running`.'
          examples: [running, completed, void]
        sides:
          type: array
          description: 'The two sides, with their team in the first game; sides keep their identity across games.'
          items: {$ref: '#/components/schemas/SeriesSide'}
        games:
          type: array
          description: 'Every game so far, in order, including void ones.'
          items: {$ref: '#/components/schemas/SeriesGame'}
        winner:
          type: [string, 'null']
          description: 'The winning side by `sides[].team`, or `null`.'
          examples: [alpha, bravo]
        created_at: {type: string, format: date-time}
        ended_at: {type: [string, 'null'], format: date-time}
    SeriesFormat:
      type: object
      description: 'Open kind; for an unknown kind the launcher shows `games` and the wins of the sides.'
      required: [kind]
      properties:
        kind:
          type: string
          examples: [best_of, first_to, fixed]
        games:
          type: integer
          minimum: 1
          description: '`best_of` (odd) and `fixed`: number of games.'
        wins:
          type: integer
          minimum: 1
          description: '`first_to`: wins needed.'
    SeriesSide:
      type: object
      required: [team, label, users, wins]
      properties:
        team: {$ref: '#/components/schemas/Team'}
        label: {$ref: '#/components/schemas/LocalizedText'}
        users:
          type: array
          items: {$ref: '#/components/schemas/User'}
        wins: {type: integer, minimum: 0}
    SeriesGame:
      type: object
      required: [index, match_id, state, winner]
      properties:
        index: {type: integer, minimum: 1}
        match_id: {$ref: '#/components/schemas/Id'}
        state:
          type: string
          description: 'The state of that match.'
        winner:
          type: [string, 'null']
          examples: [alpha, bravo]

    # ------------------------------------------------------------ 1.1: badges and titles (presentation.md)

    Badge:
      type: object
      description: 'Something a player earned on this server; the community own, never game content (presentation.md section 1).'
      required: [id, name, description, icon, color, rarity, earned_at]
      properties:
        id: {type: string}
        name: {$ref: '#/components/schemas/LocalizedText'}
        description: {$ref: '#/components/schemas/LocalizedText'}
        icon: {$ref: '#/components/schemas/Icon'}
        color: {$ref: '#/components/schemas/Color'}
        rarity: {$ref: '#/components/schemas/LocalizedText'}
        earned_at: {type: string, format: date-time}
    BadgeRef:
      type: object
      description: 'The featured badge carried by a User.'
      required: [id, icon, color]
      properties:
        id: {type: string}
        icon: {$ref: '#/components/schemas/Icon'}
        color: {$ref: '#/components/schemas/Color'}
    BadgeList:
      type: object
      required: [items, featured, title]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Badge'}
        featured:
          type: [string, 'null']
          description: 'Id of the featured badge.'
        title:
          description: 'The chosen title, or `null`.'
          oneOf: [{$ref: '#/components/schemas/LocalizedText'}, {type: 'null'}]
    Title:
      type: object
      required: [id, text, unlocked, hint]
      properties:
        id: {type: string}
        text: {$ref: '#/components/schemas/LocalizedText'}
        unlocked: {type: boolean}
        hint: {$ref: '#/components/schemas/LocalizedText'}
    TitleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Title'}

    # ------------------------------------------------------------ 1.1.4: population

    Population:
      type: object
      description: 'Counts of distinct players, never identities (api.md Population).'
      required: [online, updated_at]
      properties:
        online:
          type: integer
          minimum: 0
          description: 'Accounts with an open event connection or an authenticated request within the last 2 minutes.'
        in_match:
          type: integer
          minimum: 0
          description: 'Optional: players in a match from `ready` until the reports decide it.'
        searching:
          type: integer
          minimum: 0
          description: 'Optional: players with an active queue ticket.'
        updated_at:
          type: string
          format: date-time
          description: 'When the counts were computed.'

    # ------------------------------------------------------------ 1.1: operator API (operators.md)

    MatchPage:
      description: 'A page of matches.'
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Match'}
    OperatorMatch:
      description: 'A match with every report (the raw files); operators.md does not name the member that carries the reports.'
      allOf:
        - $ref: '#/components/schemas/Match'
    OperatorReport:
      type: object
      description: 'A report filed by a player; its shape is not specified by operators.md.'
    OperatorReportPage:
      description: 'A page of reports.'
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/OperatorReport'}
    OperatorDecision:
      description: 'A referee decision: a counted result, or a void match; the outcome `decision` becomes `admin`.'
      oneOf:
        - type: object
          title: Counted
          required: [counted, winner, rated, reason]
          properties:
            counted: {const: true}
            winner:
              type: [string, 'null']
              examples: [alpha, bravo]
            rated: {type: boolean}
            reason: {$ref: '#/components/schemas/LocalizedText'}
        - type: object
          title: Void
          required: [counted, reason]
          properties:
            counted: {const: false}
            reason: {$ref: '#/components/schemas/LocalizedText'}
    OperatorBan:
      type: object
      required: [until, reason]
      properties:
        until:
          type: [string, 'null']
          format: date-time
          description: 'End of the ban; `null` for a permanent ban.'
        reason:
          description: 'operators.md says "text": a string or localized text.'
          anyOf:
            - type: string
            - $ref: '#/components/schemas/LocalizedText'
    WebhookDelivery:
      type: object
      description: 'Body the server POSTs to an operator webhook, signed with the `Kalamar-Signature` header; delivered at least once (operators.md section 1).'
      required: [id, type, at, data]
      properties:
        id:
          type: string
          description: 'Lets receivers drop duplicates.'
        type:
          type: string
