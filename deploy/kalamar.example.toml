result_policy = "standard"

# Protocol 1.1.6 stage drafts, "pick and ban" (docs/protocol/draft.md). Between "every player accepted" (or a room
# start) and the launch, teams ban and pick stages (and modes) turn by turn; the launcher shows it, the server
# decides everything. Queues (`draft`), rooms (`rooms.drafts`) and activities (`draft`) name a preset by its id.
#
#   turns       in order: ban:<team>:<n>  pick:<team>:<n>  random[:<n>]  last  strike, optionally followed by @mode
#               (the default kind is @stage). <team>: first, second, alpha, bravo, both (both teams at once, each
#               hidden from the other until both chose), winner, loser (of the previous game of a series).
#               random draws among what remains, last plays the only one left, strike alternates single bans from
#               `first` until one stage is left. A kind with no pick, draw or last gets a random draw at the end.
#               A ban never takes the last option left.
#   first_game_turns  the turns of a series' first game (default: turns)
#   first       random | higher_rated | lower_rated (the queue's ladder) | loser | winner (previous game) | alpha | bravo
#   decider     captain (the party leader, else the first player of the team; the next connected one when the
#               captain is offline) | vote (every player votes; a strict majority, else the tally at the end) | any
#   tiebreak    captain | random (ties of a vote)
#   turn_s      time a team has for one turn (5 to 600); then the server acts, as for a team whose launchers cannot:
#   timeout     random (it draws among what remains) | skip (a ban is lost; a missing pick is drawn at the end)
#   stages      the pool (stage ids of your players' games); empty: the queue's pool, else rooms.stages, else every
#               stage all the players' games can load. A stage a player's game cannot load is never offered.
#   modes       the pool of @mode turns; empty: the queue's pool modes, or rooms.modes
#   series      per_game (a draft before every game) | once (one draft before game 1; its picks, in order, are the
#               stages of the games)
#   exclude_played  in a series, stages already played are out of the next drafts (default true)
#   required    only launchers that show the draft may play (a queue requirement, a room start check); without it,
#               the server plays the turns of teams whose launchers cannot draft
# A player who lets a turn run out can be penalized: add "draft_timeout" to [penalties] counted (queue matches).
[[drafts]]
id = "veto"
label = { en = "Stage veto", fr = "Veto des stages" }
summary = { en = "Each team bans one stage, then a stage is drawn among the rest.", fr = "Chaque équipe bannit un stage, puis un stage est tiré au sort parmi les autres." }
turns = ["ban:first:1", "ban:second:1", "random"]
first = "random"
decider = "captain"
turn_s = 20

# More formats, off until uncommented and named by a queue, a room (rooms.drafts) or an activity:
#
# Stage strike: alternate bans until one stage is left. Give it a short pool (5 to 7 stage ids of your players'
# games): every stage left over costs a turn.
# [[drafts]]
# id = "strike"
# label = { en = "Stage strike", fr = "Élimination de stages" }
# summary = { en = "Teams strike stages in turn; the last one is played.", fr = "Les équipes éliminent des stages à tour de rôle ; le dernier est joué." }
# turns = ["strike"]
# first = "lower_rated"
# stages = ["<stage id>", "<stage id>", "<stage id>", "<stage id>", "<stage id>"]
#
# Blind bans by vote (teams of several players): both teams vote two bans at once, unseen by the other team.
# [[drafts]]
# id = "blind"
# label = { en = "Blind bans", fr = "Bans à l'aveugle" }
# summary = { en = "Both teams vote two bans at once, unseen; then a random stage among the rest.", fr = "Les deux équipes votent deux bans en même temps, sans se voir ; puis un stage au hasard parmi le reste." }
# turns = ["ban:both:2", "random"]
# decider = "vote"
# tiebreak = "captain"
# turn_s = 30
#
# Mode first, then stage: one mode ban each and a draw, then the second team bans a stage and the first picks.
# [[drafts]]
# id = "mode-then-stage"
# label = { en = "Mode, then stage", fr = "Le mode, puis le stage" }
# turns = ["ban:first:1@mode", "ban:second:1@mode", "random@mode", "ban:second:1", "pick:first:1"]
# modes = ["turf", "<mode id>", "<mode id>"]
#
# A series where the loser picks: game 1 is a veto; then the previous game's winner bans one stage and its loser
# picks; a stage already played is out. Name it from an activity (draft = "loser-picks").
# [[drafts]]
# id = "loser-picks"
# label = { en = "The loser picks", fr = "Le perdant choisit" }
# first_game_turns = ["ban:first:1", "ban:second:1", "random"]
# turns = ["ban:winner:1", "pick:loser:1"]
# series = "per_game"
# exclude_played = true
#
# A series' stage order drafted once: one ban each, each team picks a game's stage, the one left decides game 3.
# [[drafts]]
# id = "series-order"
# label = { en = "Stage order", fr = "Ordre des stages" }
# turns = ["ban:first:1", "ban:second:1", "pick:first:1", "pick:second:1", "last"]
# series = "once"

