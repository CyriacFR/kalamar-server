# Operator integrations (docs/protocol/operators.md). Webhooks: signed POSTs to your tools (Kalamar-Signature header).
# [[webhooks]]
# url = "https://bot.example.org/kalamar"
# secret_file = "/etc/kalamar/webhook-secret"
# events = ["match.completed", "series.completed", "report.created"]   # empty: every event
#
# Operator API tokens (a bot, a statistics site, a referee): make one with
#   kalamar-service -c kalamar.toml admin operator-token --name bot --scopes read,results
# and paste the lines it prints here.
# [[operator_tokens]]
# name = "bot"
# sha256 = "<64 hex digits>"
# scopes = ["read", "results"]
#
# A refereed policy: add `decider = "referee"` (or "auto_then_referee") and `review_deadline_s = 3600` to a
# [[result_policies]] entry; matches then wait in state under_review for POST /v1/operator/matches/{id}/decision.

[rules]
summary = { en = "Be kind. One account per person. Results are reported by your launcher and compared with the other players' reports.", fr = "Soyez bienveillants. Un compte par personne. Les résultats sont envoyés par votre lanceur et comparés à ceux des autres joueurs." }
sections = [
  { id = "fair-play", title = { en = "Fair play", fr = "Fair-play" }, body = { en = "Every player's launcher uploads the game's record of the match and the server compares them. One player alone cannot change a result; players who agree on a false result can, and a modified game can lie to everyone. Report cheating: moderators review reports.", fr = "Le lanceur de chaque joueur envoie le relevé du match et le serveur les compare. Un joueur seul ne peut pas changer un résultat ; des joueurs qui s'entendent le peuvent, et un jeu modifié peut tromper tout le monde. Signalez la triche : les modérateurs examinent les signalements." } },
]

[events]
heartbeat_s = 20
resume_window_s = 120
buffer = 256
max_connections_per_user = 4

[retention]
raw_reports_days = 30         # raw result and status files are deleted after this (the decision is kept)
closed_reports_days = 365
erased_hold_days = 30         # an erased account's login identity (a keyed hash) keeps the open reports about it at
                              # most this long (a running cooldown and recent offenses: as long as they run); a new
                              # account with the same login takes them over. Say it in your privacy notice (section 5)
audit_days = 365              # the log of administrative actions (bans, erasures, resets by the operator)
