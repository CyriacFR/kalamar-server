  { id = "bronze", name = { en = "Bronze" }, color = "#B0703C", min = 900.0 },
  { id = "silver", name = { en = "Silver", fr = "Argent" }, color = "#A8B0B8", min = 1150.0 },
  { id = "gold", name = { en = "Gold", fr = "Or" }, color = "#D4AF37", min = 1350.0 },
  { id = "platinum", name = { en = "Platinum", fr = "Platine" }, color = "#4FB3BF", min = 1550.0 },
  { id = "diamond", name = { en = "Diamond", fr = "Diamant" }, color = "#5B8DEF", min = 1750.0 },
  { id = "master", name = { en = "Master", fr = "Maître" }, color = "#9B59B6", min = 1950.0 },
]

