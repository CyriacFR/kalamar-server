name = { en = "4 v 4", fr = "4 contre 4" }
description = { en = "Four against four, unrated.", fr = "Quatre contre quatre, sans classement." }
order = 40
teams = [4, 4]
min_teams = [2, 2]
rated = false
balance_ladder = "squad"
party_min = 1
party_max = 4
selection = "game"
pool = [{ mode = "turf" }]
result_policy = "standard"
draft = "veto"                  # 1.1.6: one ban per team, then a random stage ([[drafts]] below)

[penalties]
counted = ["decline", "accept_timeout", "no_show", "left"]
