# nginx in front of kalamar-service (HTTPS, WebSocket upgrade for /api/v1/events).
# The service listens on 127.0.0.1:8080 with server.api_url = "https://play.example.org/api" and
# server.trusted_proxies = ["127.0.0.1/32"]. Certificates: certbot or any ACME client.
# The relay is UDP and does not go through nginx: open UDP 47313 to kalamar-relay directly.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name play.example.org;

    ssl_certificate     /etc/letsencrypt/live/play.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 128k;
    # IP addresses in access logs are personal data: keep them off or short-lived.
    access_log off;

    location = /.well-known/kalamar-server.json {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # Replace (never append to) what the client sent.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Event streams stay open; the service pings every 20 s.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /privacy { root /srv/kalamar-site; try_files /privacy.html =404; }
    location = /rules   { root /srv/kalamar-site; try_files /rules.html =404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name play.example.org;
    return 301 https://$host$request_uri;
}
