[workspace]
resolver = "3"
members = ["crates/kalamar-protocol", "crates/kalamar-relay", "crates/kalamar-service", "crates/kalamar-testkit"]
default-members = ["crates/kalamar-protocol", "crates/kalamar-relay", "crates/kalamar-service", "crates/kalamar-testkit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

# Every dependency is justified in README.md ("Dependencies"). Versions are pinned by Cargo.lock.
[workspace.dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws", "matched-path"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
# axum's own, used directly for the HTTP server's header timeout and connection cap (README, "Dependencies").
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio", "server", "http1"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
sha2 = "0.11.1"
hmac = "0.13.0"
subtle = "2.6.1"
getrandom = "0.4.3"
base64 = "0.22.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form", "query"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.0"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "getrandom", "password-hash"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "ring"] }

kalamar-protocol = { path = "crates/kalamar-protocol" }
kalamar-service = { path = "crates/kalamar-service" }
kalamar-testkit = { path = "crates/kalamar-testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 4

# Password hashing is slow by design; optimized even in debug builds so that tests use the real parameters.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
