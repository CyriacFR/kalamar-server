# Proposed issue and pull request labels. GitHub does not read this file by itself: create the labels once by hand,
# or with the GitHub CLI, for example:
#   gh label create "area: protocol" --color 1D76DB --description "The specification (docs/protocol)"
# Names used by the issue forms and dependabot.yml: bug, enhancement, "needs: triage", dependencies,
# "area: deploy", "area: ci".
- name: bug
  color: "D73A4A"
  description: Something does not behave as documented
- name: enhancement
  color: "A2EEEF"
  description: A new feature or an improvement
- name: documentation
  color: "0075CA"
  description: Guides, the specification's wording, comments
- name: question
  color: "D876E3"
  description: A question the documentation should answer
- name: "needs: triage"
  color: "FBCA04"
  description: Not looked at by a maintainer yet
- name: "needs: decision"
  color: "FBCA04"
  description: Waits for a maintainer's decision
- name: good first issue
  color: "7057FF"
  description: Small, well described, a good start
- name: help wanted
  color: "008672"
  description: The maintainers would welcome a pull request
- name: "area: protocol"
  color: "1D76DB"
  description: The specification (docs/protocol)
- name: "area: service"
  color: "1D76DB"
  description: The reference service (kalamar-service)
- name: "area: relay"
  color: "1D76DB"
  description: The UDP relay (kalamar-relay)
- name: "area: testkit"
  color: "1D76DB"
  description: Simulator and conformance suite (kalamar-testkit)
- name: "area: deploy"
  color: "1D76DB"
  description: The installer and the deployment examples (deploy/)
- name: "area: ci"
  color: "1D76DB"
  description: Workflows and repository checks
- name: breaking
  color: "B60205"
  description: Needs a new major version of the protocol
- name: dependencies
  color: "0366D6"
  description: Dependency updates
- name: security
  color: "B60205"
  description: Security hardening (vulnerabilities are reported privately, SECURITY.md)
- name: duplicate
  color: "CFD3D7"
  description: Already reported
- name: out of scope
  color: "E4E669"
  description: Not accepted by the project's rules (CONTRIBUTING.md)
